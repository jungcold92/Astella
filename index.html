/* 4×4 베이어 디더 — 그라데이션이 띠지지 않고 예전 3D 느낌이 난다 */
function ditherPattern(){
  if(FX2.dpat) return FX2.dpat;
  const M=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const c=document.createElement('canvas'); c.width=4; c.height=4;
  const x=c.getContext('2d'); if(!x) return null;
  for(let i=0;i<16;i++){ const v=Math.round(M[i]/16*255);
    x.fillStyle='rgb('+v+','+v+','+v+')'; x.fillRect(i%4,(i/4)|0,1,1); }
  try{ FX2.dpat=g.createPattern(c,'repeat'); }catch(e){ FX2.dpat=null; }
  return FX2.dpat;
}
/* 이번 프레임의 광원 — 위치와 색을 모아 화면에 번지게 한다 */
function collectLights(){
  const L=[], S2=W._S, ox=cv.width/2, oy=(W._oy||cv.height*0.10);
  const put=(wx,wy,r,c,a)=>{ const p=proj(wx,wy);
    L.push({x:ox+p.sx*S2, y:oy+(p.sy-tierH(wy)*p.sc)*S2, r:r*p.sc*S2, c, a}); };
  const E=envOf();
  if(W.mode==='camp'){
    (W.props||[]).forEach(pp=>{
      if(pp.t==='fire')      put(pp.x,pp.y,46,'#ff9a3c',.30);
      else if(pp.t==='forge')put(pp.x+(pp.w||0)/2,pp.y+(pp.h||0),52,'#ff7a2a',.26);
      else if(pp.t==='sconce')put(pp.x,pp.y,30,'#ffb060',.24);
      else if(pp.t==='exitlight')put(pp.x,pp.y+(pp.h||0),96,'#ffeec0',.52);
      else if(pp.t==='portal')put(pp.x,pp.y,54,'#a05cff',.26); });
  } else {
    (W.zones||[]).forEach(z=>{ if(z.warn<=0) put(z.x,z.y,z.r*1.3,'#ff3a20',.22); });
    (W.tele||[]).forEach(tl=>{ if(tl.warn>0&&tl.type==='circle') put(tl.x,tl.y,tl.r,'#ff5030',.18); });
    if(W.beacon) put(W.beacon.x,W.beacon.y,W.beacon.r*1.2,'#6fe89a',.24);
    if(W.split) put(W.split.x,W.split.y,W.split.r*1.2,'#ff4a4a',.26);
    if(W.boss&&W.boss.hp>0){
      const bc=W.boss.cast?1.7:1;
      put(W.boss.x,W.boss.y-4,58*bc,E.shaft,(W.boss.cast?.34:.16)); }
    (W.orbs||[]).forEach(o=>{ if(!o.taken) put(o.x,o.y,28,'#8fd8ff',.22); });
  }
  // 무대 자체의 빛 — 뒷벽 횃불 두 개와 바닥에 닿는 빛기둥
  const bw=(W.x1-W.x0)*PJ.conv*lerp(PJ.far,PJ.near,0)*1.05;
  [-bw*0.34,bw*0.34].forEach(tx=>{ const p=proj(0,W.y0);
    L.push({x:ox+(tx)*S2, y:oy+(p.sy-52)*S2, r:34*S2, c:E.shaft, a:.20}); });
  [[-.62,34],[-.18,26],[.24,30],[.66,22]].forEach(sf=>{
    const bx=lerp(W.x0,W.x1,(sf[0]+1)/2), p=proj(bx,W.y1-26);
    L.push({x:ox+p.sx*S2, y:oy+p.sy*S2, r:sf[1]*1.5*p.sc*S2, c:E.shaft, a:E.shaftA*1.5}); });
  const me=W.me;
  if(me&&!me.dead){
    const gl=SPECS[P.spec]?SPECS[P.spec].color:'#fff';
    put(me.x,me.y-8,typeof W.casting==='number'?40:24,gl,typeof W.casting==='number'?.30:.14);
    const au=cosOf('aura'); if(au) put(me.x,me.y-10,34,au.v,.22); }
  (W.party||[]).forEach(u=>{ if(u.dead) return;
    if(u.aura) put(u.x,u.y-10,30,u.aura,.16); });
  return L;
}
function postProcess(){
  if(!FX2.q) return;
  const G2=GRADE[W.envKey||'keep']||GRADE.keep;
  const W2=cv.width, H2=cv.height;
  g.save(); g.setTransform(1,0,0,1,0,0);
  try{
    // ── 1) 블룸 — 밝은 곳이 번져 나온다 ─────────────────
    if(G2.bloom>0){
      const dv=FX2.q>=2?4:6, bw=Math.max(8,(W2/dv)|0), bh=Math.max(8,(H2/dv)|0);
      const A=fxCanvas('a',bw,bh), B=fxCanvas('b',bw,bh);
      const ga=A.getContext('2d'), gb=B.getContext('2d');
      if(ga&&gb){
        ga.globalCompositeOperation='source-over'; ga.globalAlpha=1;
        ga.clearRect(0,0,bw,bh);
        ga.imageSmoothingEnabled=true; ga.drawImage(cv,0,0,bw,bh);
        // 자기 자신을 곱해 어두운 곳을 죽인다 → 밝은 곳만 남는 싸구려 임계값
        ga.globalCompositeOperation='multiply';
        ga.drawImage(A,0,0); if(FX2.q>=2) ga.drawImage(A,0,0);
        ga.globalCompositeOperation='source-over';
        // 흐리기: 축소·확대를 두 번
        gb.clearRect(0,0,bw,bh); gb.imageSmoothingEnabled=true;
        gb.drawImage(A,0,0,(bw/2)|0,(bh/2)|0);
        ga.clearRect(0,0,bw,bh);
        ga.drawImage(B,0,0,(bw/2)|0,(bh/2)|0,0,0,bw,bh);
        g.globalCompositeOperation='lighter';
        g.globalAlpha=G2.bloom; g.imageSmoothingEnabled=true;
        g.drawImage(A,0,0,W2,H2);
        g.imageSmoothingEnabled=false;
      }
    }
    // ── 2) 광원 번짐 — 불·주문·장판이 공기를 물들인다 ────
    g.globalCompositeOperation='lighter';
    collectLights().forEach(L=>{
      if(L.r<=0) return;
      const rg=g.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);
      rg.addColorStop(0,L.c); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.globalAlpha=L.a; g.fillStyle=rg;
      g.fillRect(L.x-L.r,L.y-L.r,L.r*2,L.r*2); });
    // ── 3) 색보정 — 어두운 곳에 색을 얹고(lift) 전체를 물들인다(tint) ──
    g.globalCompositeOperation='screen'; g.globalAlpha=G2.liftA;
    g.fillStyle=G2.lift; g.fillRect(0,0,W2,H2);
    g.globalCompositeOperation='multiply'; g.globalAlpha=G2.tintA;
    g.fillStyle=G2.tint; g.fillRect(0,0,W2,H2);
    g.globalCompositeOperation='soft-light'; g.globalAlpha=.30;
    g.fillStyle=G2.warm?'#ffd0a0':'#a0c8ff'; g.fillRect(0,0,W2,H2);
  }catch(e){ FX2.q=0; }                     // 핵심 단계가 안 되면 조용히 끈다
  // ── 4) 깊이 채도 — 멀수록 색이 빠져 공기원근이 생긴다 ──
  if(FX2.sat!==0&&G2.sat>0&&FX2.q>=2){
    try{ const lg=g.createLinearGradient(0,0,0,H2);
      lg.addColorStop(0,'rgba(150,150,150,'+G2.sat.toFixed(2)+')');
      lg.addColorStop(.55,'rgba(150,150,150,0)');
      g.globalCompositeOperation='saturation'; g.globalAlpha=1;
      g.fillStyle=lg; g.fillRect(0,0,W2,H2);
    }catch(e){ FX2.sat=0; } }
  // ── 5) 디더 — 띠 지는 그라데이션을 잘게 부순다 ────────
  if(FX2.dith!==0&&FX2.q>=2){
    try{ const dp=ditherPattern();
      if(dp){ g.globalCompositeOperation='overlay'; g.globalAlpha=.055;
        g.fillStyle=dp; g.fillRect(0,0,W2,H2); } else FX2.dith=0;
    }catch(e){ FX2.dith=0; } }
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  g.restore();
}
/* 무대(바닥+벽) — 사다리꼴 원근 */
function drawStage(){
  const cam=W.mode==='camp'
    ? {floor:W.pal.g,floor2:W.pal.g2,wall:W.pal.wall,accent:W.pal.accent,sky:W.pal.sky}

  g.fillStyle=cam.sky; g.fillRect(-cv.width, topP.sy-260, cv.width*2, 260+ (botP.sy-topP.sy) + 400);
  const bw=(W.x1-W.x0)*PJ.conv*lerp(PJ.far,PJ.near,0)*1.05;

/* 바닥 질감 — 눈·잿가루·허공·모래 결이 밴드마다 다르게 얹힌다 */

/* 안개층 · 빛기둥 · 부유물 · 바닥 반사 */

    g.lineTo(pBot.sx+wBot/2,pBot.sy);    g.lineTo(pBot.sx-wBot/2,pBot.sy);
    g.closePath(); g.fill();
    g.globalAlpha=a*0.55;                                 // 심지

    g.lineTo(pBot.sx+wBot/5,pBot.sy);    g.lineTo(pBot.sx-wBot/5,pBot.sy);

}

function drawFxProjected(){
  FX.forEach(f=>{ const d=f.d,k=d.k,pr=f.t/f.life;
    if(k==='proj'||k==='arrow'){ const p=proj(f.cx,f.cy+8);
      g.fillStyle=d.c; g.fillRect(p.sx-2*p.sc,p.sy-10*p.sc,4*p.sc,4*p.sc);
      g.fillStyle=d.c2; g.fillRect(p.sx-1*p.sc,p.sy-9*p.sc,2*p.sc,2*p.sc);
      g.globalAlpha=.35; g.fillStyle=d.c;
      g.fillRect(p.sx-4*p.sc,p.sy-12*p.sc,8*p.sc,8*p.sc); g.globalAlpha=1; }
    else if(k==='area') groundEllipse(f.x,f.y,f.r,d.c,.16*clamp(1-pr,0,1)+.10);
    else if(k==='burst'||k==='shock') groundRing(f.x,f.y,f.r*pr+3,d.c,1-pr,3);
    else if(k==='ring'){ const p=proj(f.x,f.y); g.globalAlpha=1-pr; g.fillStyle=d.c;
      const r=(6+pr*16)*p.sc;
      for(let a=0;a<6.283;a+=.16) g.fillRect(p.sx+Math.cos(a)*r,p.sy-10*p.sc+Math.sin(a)*r*.6,2,2);
      g.globalAlpha=1; }
    else if(k==='slash'){ const p=proj(f.x,f.y); g.globalAlpha=1-pr;
      for(let i=0;i<10;i++){ const a=-.9+i*.19+(f.rot||0), R=(10+(f.r||14)*.4)*p.sc;
        g.fillStyle=i%3?d.c:d.c2;
        g.fillRect(p.sx+Math.cos(a)*R,p.sy-12*p.sc+Math.sin(a)*R*.7,2*p.sc,2*p.sc); }
      g.globalAlpha=1; }
    else if(k==='beam'){ const a=proj(f.x0,f.y0), b=proj(f.tx,f.ty); g.globalAlpha=1-pr;
      for(let i=0;i<=20;i++){ const t2=i/20;
        g.fillStyle=i%2?d.c:d.c2;
        g.fillRect(lerp(a.sx,b.sx,t2),lerp(a.sy-12*a.sc,b.sy-10*b.sc,t2),3,3); } g.globalAlpha=1; }
    else if(k==='shield'){ const p=proj(f.x,f.y); g.globalAlpha=.3+.2*Math.sin(f.t*10);
      g.fillStyle=d.c; const r=15*p.sc;
      for(let a=0;a<6.283;a+=.16) g.fillRect(p.sx+Math.cos(a)*r,p.sy-14*p.sc+Math.sin(a)*r,2,2);
      g.globalAlpha=1; }
  });
  PT.forEach(p2=>{ const p=proj(p2.x,p2.y+6);
    g.globalAlpha=clamp(p2.life/p2.max,0,1); g.fillStyle=p2.c;
    g.fillRect(p.sx,p.sy-12*p.sc,p2.s*p.sc,p2.s*p.sc); });
  g.globalAlpha=1;
}

function finishRun(win,R){
  R=R||W;
  if(!R||!R.raid||R.finished||R.prologue) return;   // 이미 정산했거나 던전이 아니면 무시
  R.finished=true;
  const raid=R.raid, dur=(now()-R.startAt)/1000;
  const flawless=win&&R.deaths===0;
  let items=R.loot.slice(), gold=R.gold, xp=R.xp;
  if(win){
    const firstClear=!P.cleared[raid.id];
    P.cleared[raid.id]=1; P.cleared[raid.id+'_'+(R.diff||DIFFS[0]).id]=1; bump('boss',1); bump('b_'+raid.id,1);
    if(firstClear&&raid.id==='r4') R.actBreak=true;      // 아즈라칸 첫 처치 → 막간
    if(firstClear&&raid.id==='r5') R.epilogue=true;
    const DF=R.diff||DIFFS[0];
    const SZ=R.psz||PARTY_SIZES[4];
    gold+=Math.round(rint(raid.gold[0],raid.gold[1])*DF.gold*SZ.rew);
    xp+=Math.round(250*DF.xp*SZ.rew);
    const prim=derive().prim;
    const dropN=Math.max(1,Math.round((rint(2,3)+(DF.bias>0?1:0))*(SZ.rew*0.6+0.4)));
    for(let i=0;i<dropN;i++)
      items.push(genItem(rint(raid.lootIlvl[0],raid.lootIlvl[1])+DF.loot,Math.min(3,raid.bias+DF.bias),null,prim));
    if(!R.usedAuto){
      raid.unique.forEach(u=>{ if(Math.random()<u.ch){
        const it=genItem(raid.lootIlvl[1]+6+DF.loot,Math.min(3,raid.bias+DF.bias),u.slot,prim,u.r);
        it.name=u.n+(DF.id!=='n'?' ['+DF.n+']':''); it.unique=1;
        if(u.m!==undefined) it.m=u.m;      // 이름 있는 유물은 생김새도 고정
        items.push(it); } });
    }
    if(flawless) bump('flawless',1);
  }
  items.forEach(it=>{ P.bag.push(it); codexAdd(it); if(it.r===4) bump('legend',1); if(it.r>=5) bump('relic',1); });
  P.gold+=gold; const ups=addXp(xp);
  const achs=checkAch(); save();
  const body=$('#ovBody');
  body.innerHTML=`<div style="font-size:13px;color:${win?'#ffcf6b':'#c96b6b'};margin-bottom:8px">
      ${win?'원정 성공':'원정 실패'} — ${raid.n} · ${dur.toFixed(0)}초 · 처치 ${R.killed}</div>
    ${R.usedAuto&&win?'<div style="font-size:11px;color:#c9764a;margin-bottom:8px">자동 조작 사용 — 보스 전용 전리품이 제외되었습니다.</div>':''}
    <div style="font-size:11.5px;margin-bottom:9px">금화 <b class="gold">+${fmt(gold)}</b> · 숙련도 <b class="gold">+${fmt(xp)}</b>
      ${flawless?' · <b style="color:#7fd8ff">무피해 클리어</b>':''}</div>
    ${ups.length?'<div style="font-size:12px;color:#ffcf6b;margin-bottom:8px">숙련도 상승! '+ups.map(u=>u.n+' — '+u.d).join(' / ')+'</div>':''}
    ${achs.length?'<div style="font-size:12px;color:#7fd8ff;margin-bottom:8px">업적 달성! '+achs.map(a=>a.n+(a.title?' (칭호: '+a.title+')':'')).join(', ')+'</div>':''}
    <div class="grid" id="lootGrid"></div>
    <div style="margin-top:12px"><button class="pri" id="btnRunBack" style="width:100%;padding:12px">도시로 돌아가기</button></div>`;
  $('#ovTitle').textContent='원정 결과'; $('#ovSub').textContent='';
  $('#ov').classList.remove('hide');
  const grid=$('#lootGrid');
  items.forEach(it=>{ const c=document.createElement('div'); c.className='cell rn'+Math.min(4,it.r);
    const cvs=document.createElement('canvas'); cvs.width=48; cvs.height=48; c.appendChild(cvs);
    drawItemIcon(cvs.getContext('2d'),it,3); c.title=it.name;
    c.onclick=()=>toast('<b style="color:'+RARITY[it.r].c+'">'+it.name+'</b> i'+it.ilvl);
    grid.appendChild(c); });
  if(!items.length) grid.innerHTML='<div class="dim" style="font-size:11px">획득한 장비 없음</div>';
  $('#btnRunBack').onclick=()=>{ $('#ov').classList.add('hide');
    if(R.actBreak){ playAct2(); return; }              // 막간 — 이야기가 이어진다
    if(R.epilogue){ playEpilogue(); return; }
    enterCamp(); };
  running=true;
}

function currentObjective(){
  if(!W) return null;
  if(W.mode==='arena'){
    if(W.pvp) return {t:(W.foe?W.foe.name:'상대')+' 격파',s:'장판을 피하고 화력을 몰아치세요',
      x:W.foe?W.foe.x:0,y:W.foe?W.foe.y:40};
    if(W.phase==='boss'&&W.boss) return {t:W.boss.name+' 처치',
      s:'붉은 장판과 표시된 원을 피하세요',x:W.boss.x,y:W.boss.y};
    if(W.phase==='gate') return {t:'문이 열립니다',s:'안쪽으로 들어가세요',x:0,y:W.gate};
    const left=W.mobs.filter(m=>m.hp>0).length;
    const G=GATES[W.wave]||GATES[0];
    return {t:G.n+' '+(W.wave+1)+'/'+gateCount()+(left?' ('+left+'마리)':''),
      s:G.d,x:0,y:80};
  }
  if(W.crypt) return {t:'지상으로 올라간다',s:'위쪽 빛을 향해 계단을 오르세요',x:0,y:14};
  const npc=id=>W.npcs.find(n=>n.id===id);
  const d=derive();
  let better=0; P.bag.forEach(it=>{ const c=P.equip[it.slot]; if(!c||iScore(it)>iScore(c)) better++; });
  if(better){ const n=npc('smith');
    return {t:'장비 정비 ('+better+'개 교체 가능)',s:'대장장이 발덴에게 가세요',x:n.x,y:n.y}; }
  const open=[0,1,2,3].filter(i=>skillOpen(i)).length;
  if(!P.seenSkills||P.seenSkills<open){ const n=npc('trainer');
    return {t:'새 스킬 확인',s:'교관 세이든에게 가세요',x:n.x,y:n.y}; }
  const q=QUESTS.find(x=>{const st=P.quest[x.id]; return st&&st.done&&!st.paid;});
  if(q){ const n=npc('quest');
    return {t:'임무 보상 — '+q.n,
      s:'임무관 코르에게 · 금화 '+q.gold+(q.gem?' · 보석 '+q.gem:'')+' · 숙련도 '+q.xp,x:n.x,y:n.y}; }
  const raid=RAIDS.filter(r=>d.avgIlvl>=r.req).pop()||RAIDS[0];
  return {t:'균열문 — '+raid.n+' 또는 투기장',s:'중앙 균열문으로 가세요',x:0,y:78};
}

function drawPotionIcon(ctx,c,scale){
  withCtx(ctx,scale,()=>{
    px(0,0,16,16,'#0e0e18');
    if(!c){ px(5,4,6,9,'#3a3446'); px(6,2,4,3,'#4a4458');
      px(0,0,16,1,'#3a3a58'); px(0,15,16,1,'#3a3a58'); return; }
    const CC={heal:'#4ce04c',dmg:'#ff6b3c',dr:'#8fb8ff',spd:'#ffe06b',free:'#c9a0ff'}[c.use]||'#8fd8ff';
    px(6,1,4,3,'#6a5a3a'); px(5,3,6,2,'#8a7a4a');
    px(4,5,8,9,sh(CC,-45)); px(5,6,6,7,CC); px(6,7,2,4,sh(CC,60));
    px(4,5,8,1,sh(CC,30));

/* 추가 스킬 아이콘 — 성격에 따라 다른 문양 */
function drawExtraIcon(ctx,sk,scale){
  const C=SPECS[P.spec].color, L=sh(C,55), D=sh(C,-45);
  withCtx(ctx,scale,()=>{
    px(0,0,16,16,'#0e0e18'); px(0,0,16,1,D); px(0,15,16,1,'#05050a');
    if(sk.tag==='blink'||sk.tag==='blinkhit'){
      for(let i=0;i<6;i++) px(2+i,12-i*1.6,2,2,i>3?L:C);
      px(11,2,4,4,'#fff'); px(2,11,3,3,L); }
    else if(sk.tag==='selfheal'||sk.kind==='heal'){
      px(7,3,2,10,L); px(4,6,8,2,L);
      for(let a=0;a<6.28;a+=.5) px(8+Math.cos(a)*6,8+Math.sin(a)*6,1,1,C); }
    else if(sk.tag==='wall'){ for(let r=0;r<11;r++){const w=12-Math.max(0,r-5)*2; px(8-w/2,3+r,w,1,r<2?L:C);}
      px(6,6,4,4,'#0e0e18'); }
    else if(sk.kind==='aoe'){ for(let a=0;a<6.28;a+=.42) px(8+Math.cos(a)*5.5,8+Math.sin(a)*5.5,2,2,C);
      for(let a=0;a<6.28;a+=.6) px(8+Math.cos(a)*3,8+Math.sin(a)*3,2,2,L); px(7,7,2,2,'#fff'); }
    else if(sk.kind==='buff'){ for(let r=0;r<9;r++){const w=10-Math.abs(4-r)*1.6; px(8-w/2,4+r,w,1,C);}
      px(6,6,4,4,L); px(7,2,2,3,L); }
    else { for(let t=1;t<12;t++) px(2+t,13-t,2,2,t>8?L:C); px(11,2,4,4,'#fff'); }
    px(0,0,1,16,'#8fc0ff'); px(15,0,1,16,'#8fc0ff');
  });
}

function rotationGuide(){
  const sp=SPECS[P.spec], sk=i=>sp.skills[i];
  const buffIdx=[0,1,2,3].filter(i=>['haste','dmgup','dotup'].includes(sk(i).tag));
  const dotIdx =[0,1,2,3].filter(i=>['ignite','stack','stack2'].includes(sk(i).tag));
  const aoeIdx =[0,1,2,3].filter(i=>sk(i).kind==='aoe');
  const exIdx  =[0,1,2,3].filter(i=>sk(i).tag==='exec_hp'||sk(i).tag==='exec_slow');
  const filler =0;
  const line=[];
  buffIdx.forEach(i=>line.push({p:'전투 시작',n:(i+1)+'. '+sk(i).n,d:'쿨기를 먼저 켜고 시작한다'}));
  dotIdx.forEach(i=>line.push({p:'유지',n:(i+1)+'. '+sk(i).n,d:'지속 효과가 끊기지 않게 갱신'}));
  exIdx.forEach(i=>line.push({p:'조건',n:(i+1)+'. '+sk(i).n,d:sk(i).tag==='exec_hp'?'적 체력이 낮을 때만':'둔화된 적에게만'}));
  aoeIdx.forEach(i=>line.push({p:'광역',n:(i+1)+'. '+sk(i).n,d:'적이 2마리 이상일 때'}));
  [1,2,3].filter(i=>!buffIdx.includes(i)&&!dotIdx.includes(i)&&!aoeIdx.includes(i)&&!exIdx.includes(i))
    .forEach(i=>line.push({p:'쿨마다',n:(i+1)+'. '+sk(i).n,d:'재사용 대기가 끝나는 즉시'}));
  line.push({p:'그 외',n:(filler+1)+'. '+sk(filler).n,d:'다른 스킬이 전부 대기 중일 때 채우기'});
  (P.slots||[]).forEach((k,idx)=>{ if(!k) return;
    line.push({p:'상황',n:(idx+5)+'. '+EXTRA[k].n,d:EXTRA[k].d}); });
  return line;
}

function codexAdd(it){
  P.codex=P.codex||{};
  /* 외형 수집 — 한 번이라도 얻은 생김새는 영구히 기록된다. 모습변환의 재료가 된다. */
  P.codex.app=P.codex.app||{};
  const key=it.slot+(it.slot==='weapon'?(':'+(it.w||'sword')):(':'+(it.m|0)));
  const prev=P.codex.app[key];
  if(prev===undefined||prev<it.r) P.codex.app[key]=it.r;
  if(it.unique){ P.codex.unique=P.codex.unique||{}; P.codex.unique[it.name]=1; }
  if(!it.set) return;
  const o=P.codex[it.set]=P.codex[it.set]||{};
  if(!o[it.slot]||(o[it.slot].r||0)<it.r) o[it.slot]={r:it.r,leg:!!it.leg};
}

function migrate(c){ // 구버전 세이브 호환
  c.fac=c.fac||(RACES[c.race]?RACES[c.race].f:'dawn');
  c.seal=c.seal||0; c.rating=c.rating||1000; c.pvpW=c.pvpW||0; c.pvpL=c.pvpL||0;
  c.tree=c.tree||{}; c.pool=c.pool||[]; c.slots=c.slots||[]; c.party5=c.party5||5;
  while(c.slots.length<4) c.slots.push(null);
  c.codex=c.codex||{};
  try{ const _p=P; P=c; codexScan(); P=_p; }catch(e){}
  SLOTS.forEach(([sl])=>{ const it=c.equip[sl]; if(it&&it.up===undefined) it.up=0; });
  c.skin=c.skin||(RACES[c.race]?RACES[c.race].skin:'#e8b58a'); c.beard=c.beard|0;
  c.owned=c.owned||{}; c.titles=c.titles||[]; c.ach=c.ach||{}; c.quest=c.quest||{};
  c.stat=Object.assign({kill:0,elite:0,room:0,wave:0,chest:0,boss:0,legend:0,relic:0,flawless:0,mount:0,
    duel:0,duelWin:0,b_r1:0,b_r2:0,b_r3:0,b_r4:0,b_r5:0,fallen:0},c.stat||{});
  c.cos=c.cos||{}; c.cleared=c.cleared||{}; c.passives=c.passives||[]; c.runes=c.runes||[];
  while(c.runes.length<6) c.runes.push(0);
  c.sup=c.sup||{}; c.prep=c.prep||{food:null,oil:null,potion:null}; c.mog=c.mog||{};
  fixModels(c);
}
/* 모델 시스템 이전 세이브 — 부위별 외형을 결정적으로 채운다 */
function fixModels(c){
  const cls=(c.spec&&SPECS[c.spec])?SPECS[c.spec].cls:null;
  const prim=cls?CLASSES[cls].prim:'str';
  const fix=it=>{ if(!it) return;
    if(it.slot==='weapon'){
      if(!it.w){ const pool=wpool(prim,cls);
        const i=Math.abs((it.uid|0)+(it.ilvl|0))%pool.length; it.m=i; it.w=pool[i][1]; } }
    else if(it.m===undefined){ const pool=BASE[it.slot]||['']; 
      it.m=Math.abs((it.uid|0)*7+(it.ilvl|0))%pool.length; } };
  SLOTS.forEach(([sl])=>fix(c.equip&&c.equip[sl]));
  (c.bag||[]).forEach(fix);
}

function grantAll(c){
  c.gm=1; c.rank=MAX_RANK; c.xp=0;
  c.gold=9999999; c.gem=99999; c.seal=99999; c.rating=Math.max(c.rating||1000,1500);
  COSMETICS.forEach(x=>c.owned[x.id]=1); MOUNTS.forEach(x=>c.owned[x.id]=1);
  c.stat.mount=Math.max(c.stat.mount||0,1);
  RAIDS.forEach(r=>{ c.cleared[r.id]=1; DIFFS.forEach(d=>c.cleared[r.id+'_'+d.id]=1); });
  const prim=CLASSES[SPECS[c.spec].cls].prim;
  const cls=SPECS[c.spec].cls;
  // 최종 단계 장비를 유물 등급으로 — 모든 기능을 바로 시험할 수 있게
  SLOTS.forEach(([id])=>{ const it=genItem(172,3,id,prim,5); it.up=17; it.set='s2'; c.equip[id]=it; });
  // 가방에 세트별 한 벌씩 — 세트 각인·모습변환을 바로 써 볼 수 있다
  c.bag=c.bag||[];
  ITEM_SETS.forEach(st=>SLOTS.forEach(([id])=>{
    const it=genItem(172,3,id,prim,5); it.set=st.id; c.bag.push(it); }));
  // 도감 — 모든 세트 · 모든 생김새 · 모든 전용 드랍
  c.codex=c.codex||{}; c.codex.app=c.codex.app||{}; c.codex.unique=c.codex.unique||{};
  ITEM_SETS.forEach(st=>{ const o=c.codex[st.id]=c.codex[st.id]||{};
    SLOTS.forEach(([sl])=>o[sl]={r:5,leg:true}); });
  Object.keys(BASE).forEach(sl=>{ if(sl==='weapon') return;
    BASE[sl].forEach((_,mi)=>c.codex.app[sl+':'+mi]=5); });
  ['str','int','agi'].forEach(pr=>WMODELS[pr].forEach(([_,wt])=>c.codex.app['weapon:'+wt]=5));
  ['rune','shadowy','holy'].forEach(k=>WMODELS[k].forEach(([_,wt])=>c.codex.app['weapon:'+wt]=5));
  RAIDS.forEach(r=>r.unique.forEach(u=>c.codex.unique[u.n]=1));
  ['a','b','c'].forEach(br=>{ for(let t=1;t<=4;t++) c.tree[br+t]=1; }); c.tree.cap=1;
  c.pool=[]; Object.keys(TREE_SKILL).forEach(k=>{ const v=TREE_SKILL[k];
    const key=v.startsWith('CLASS')?CLASS_EXTRA[SPECS[c.spec].cls][+v[5]]:v;
    if(!c.pool.includes(key)) c.pool.push(key); });
  c.slots=[c.pool[0]||null,c.pool[1]||null,c.pool[2]||null,c.pool[3]||null];
  c.passives=['p1','p7','p8'];
  c.runes=[1,1,1,1,1,1];
  c.sup=c.sup||{}; CONSUM.forEach(x=>c.sup[x.id]=99);
  c.prep={food:'f4',oil:'e1',potion:'p1'};
  ACHIEVE.forEach(a=>{ c.ach[a.id]=1; if(a.title&&!c.titles.includes(a.title)) c.titles.push(a.title); });
  c.title=c.titles[0]||null;
}

  Object.entries(FACTIONS).forEach(([k,f])=>{
    const d=document.createElement('div'); d.className='tile st'+(CC.fac===k?' on':'');
    d.appendChild(iconCanvas(x=>drawEmblem(x,f.em,f.c,3),48));
    d.insertAdjacentHTML('beforeend','<div class="tn" style="color:'+(CC.fac===k?'#f0d67a':f.c)+'">'+f.n+'</div>');
    d.onclick=()=>{ if(CC.fac!==k) setRace(racesOf(k)[0][0]); renderCreate(); };
    ft.appendChild(d); });
  const rt=$('#raceTiles'); rt.innerHTML='';
  racesOf(CC.fac).forEach(([k,r])=>{
    const d=document.createElement('div'); d.className='tile'+(CC.race===k?' on':'');
    const c=document.createElement('canvas'); c.width=80; c.height=50;
    drawFace(c.getContext('2d'),k,CC.hair,CC.hairStyle,5,
      CC.race===k?CC.skin:null, CC.race===k?CC.beard:0);
    d.appendChild(c); d.insertAdjacentHTML('beforeend','<div class="tn">'+r.n+'</div>');
    d.onclick=()=>{ setRace(k); renderCreate(); }; rt.appendChild(d); });
  const ct=$('#clsTiles'); ct.innerHTML='';
  Object.entries(CLASSES).forEach(([k,c])=>{
    const d=document.createElement('div'); d.className='tile ct'+(CC.cls===k?' on':'');
    d.appendChild(iconCanvas(x=>drawEmblem(x,CLS_ICON[k],'#c9b06b',3),48));
    d.insertAdjacentHTML('beforeend','<div class="tn">'+c.n+'</div>');
    d.onclick=()=>{ CC.cls=k; CC.spec=null; renderCreate(); }; ct.appendChild(d); });
  const st=$('#specTiles'); st.innerHTML='';
  Object.entries(SPECS).filter(([,s2])=>s2.cls===CC.cls).forEach(([k,s2])=>{
    const d=document.createElement('div'); d.className='tile st'+(CC.spec===k?' on':'');
    d.appendChild(iconCanvas(x=>drawEmblem(x,SPEC_ICON[k],s2.color,3),48));
    d.insertAdjacentHTML('beforeend','<div class="tn" style="color:'+(CC.spec===k?'#f0d67a':s2.color)+'">'+s2.n+'</div>'
      +'<div class="tn" style="font-size:9px;color:#7b7291">'+s2.role+'</div>');
    d.onclick=()=>{ CC.spec=k; renderCreate(); }; st.appendChild(d); });
  const mk=(host,arr,cur,set,isColor)=>{ const h=$(host); h.innerHTML='';
    arr.forEach((v,i)=>{ const d=document.createElement('div');
      const val=isColor?v:i;
      d.className='sw'+(cur===val?' on':'');
      if(isColor) d.style.background=v; else { d.textContent=v; d.style.width='auto'; d.style.padding='0 7px'; }
      d.onclick=()=>{ set(val); renderCreate(); }; h.appendChild(d); }); };
  mk('#skinSw',SKIN_SETS[CC.race]||[RACES[CC.race].skin],CC.skin,v=>CC.skin=v,true);
  mk('#hairSw',HAIRS,CC.hair,v=>CC.hair=v,true);
  mk('#hairSt',HAIR_NAMES,CC.hairStyle,v=>CC.hairStyle=v,false);
  mk('#beardSw',BEARD_NAMES,CC.beard,v=>CC.beard=v,false);
  const F=FACTIONS[CC.fac], R=RACES[CC.race], C=CLASSES[CC.cls], S2=CC.spec?SPECS[CC.spec]:null;
  $('#ccInfo').innerHTML=`<b style="color:${F.c}">${F.n}</b>
    <span class="dim" style="font-size:10px">「${F.motto}」</span><br>
    <span style="font-size:10.5px;color:#9a92b2">${F.d.replace(/\n/g,'<br>')}</span>
    <div class="rule"></div>
    <b style="color:#f0d67a">${R.n}</b><br>${R.d}<br><b style="color:#8fc0ff">${R.p}</b>
    <div class="rule"></div>
    <b style="color:#f0d67a">${C.n}</b><br>${C.d}
    ${S2?`<div class="rule"></div><b style="color:${S2.color}">${S2.n} · ${S2.role}</b><br>${S2.d}
      <div style="margin-top:6px;font-size:10.5px;color:#8d8499">시작 시 1번 스킬만 사용 가능 —
      숙련도를 올려 나머지를 해금합니다.</div>`:''}`;
  const nm=$('#nameIn').value.trim();
  $('#btnBirth').disabled=!(CC.spec&&nm.length>=1);
  $('#pvName').innerHTML=(nm||'(이름 미입력)')+
    (S2?` <span style="color:${F.c}">· ${F.n}</span><br><span class="dim">${R.n} ${C.n} / ${S2.n}</span>`:'');
  drawPreview();
}
function setRace(k){ CC.race=k; CC.fac=RACES[k].f;
  const set=SKIN_SETS[k]||[RACES[k].skin];
  if(!set.includes(CC.skin)) CC.skin=set[Math.min(1,set.length-1)];
  if(!set.includes(CC.skin)) CC.skin=RACES[k].skin; }
let pvRaf=0;
function drawPreview(){
  const c=$('#pv'); if(!c) return; const ctx=c.getContext('2d');
  cancelAnimationFrame(pvRaf);
  const tick=()=>{ if($('#scr-create').classList.contains('hide')) return;
    const t=performance.now()/1000;
    withCtx(ctx,5,()=>{ px(0,0,52,60,'#0a0a14');
      for(let j=0;j<60;j+=6) for(let i=0;i<52;i+=6) px(i,j,6,6,(i+j)%12?'#0e0e18':'#111120');
      for(let i=0;i<52;i+=4) px(i,46,4,2,'#1a1a28');
      px(6,44,40,3,'#20202e'); px(8,43,36,2,'#2a2a3c');
      const glow=CC.spec?SPECS[CC.spec].color:'#8a8aa8';
      g.globalAlpha=.10; px(12,10,28,36,glow); g.globalAlpha=1;
      drawChar({x:26,y:44,skin:CC.skin,beard:CC.beard,hair:CC.hair,hairStyle:CC.hairStyle,
        body:'#4a4a66',trim:'#8a8aa8',wpn:CC.spec?(CLASSES[CC.cls].prim==='int'?'staff':
          CLASSES[CC.cls].prim==='agi'?'bow':(CC.spec==='prot'?'shield':'sword')):'none',
        glow,t,anim:'idle',at:t,face:1}); });
    pvRaf=requestAnimationFrame(tick); };
  tick();
}

let PRO_BACKUP=null, PRO_MODE=false, FALL_SCENES=[];
function enterPrologue(){
  const raid=RAIDS[3];   // 프롤로그의 그 용 = 최종 보스
  const w=buildArena(raid); w.prologue=true;
  w.diff={id:'p',n:'회상',hp:1,dmg:0.22,loot:0,bias:0,req:0,gold:0,xp:0};
  PRO_BACKUP={rank:P.rank,equip:P.equip,tree:P.tree,pool:P.pool,slots:P.slots,
    runes:P.runes,passives:P.passives};
  P.rank=MAX_RANK; P.runes=[0,0,0,0,0,0]; P.passives=['p1','p7','p8'];
  P.tree={}; P.pool=[]; P.slots=[null,null,null,null];
  ['a','b','c'].forEach(br=>{ for(let t=1;t<=4;t++) P.tree[br+t]=1; }); P.tree.cap=1;
  Object.keys(TREE_SKILL).forEach(k=>{ const v=TREE_SKILL[k];
    const key=v.startsWith('CLASS')?CLASS_EXTRA[SPECS[P.spec].cls][+v[5]]:v;
    if(!P.pool.includes(key)) P.pool.push(key); });
  P.slots=[P.pool[0]||null,P.pool[1]||null,P.pool[2]||null,P.pool[3]||null];
  P.equip={}; const prim=CLASSES[SPECS[P.spec].cls].prim;
  SLOTS.forEach(([id])=>P.equip[id]=genItem(120,3,id,prim,4));
  const d=derive(), pdps=estDpsFull(d);
  w.me=makeMe(); w.me.x=0; w.me.y=150;
  w.party=makeHeroParty(d,pdps);                 // 여명의 다섯 — 고정 인물
  w.party.forEach((pp,i)=>{ pp.x=-66+i*33; pp.y=166+((i%2)?6:0); });
  w.d=d; w.pdps=pdps; w.trail=[{x:0,y:150}];
  w.phase='boss'; w.gateOpen=true; w.gate=undefined; w.proT=0; w.proStage=0;
  PRO_LINES.forEach(L=>L[3]=0);
  W=w; startBoss();
  W.boss.hp=W.boss.maxhp=raid.hp*24; W.boss.enrageT=999;   // 대본이 끝날 때까지 버틴다
  W.boss.name='검은 태양의 용 · 아즈라칸'; W.boss.type='dragon'; W.boss.color='#15111f';
  W.envKey='sky';
  Music.set('boss'); $('#bossBox').classList.remove('hide');
  $('#cZone').textContent='오백 년 전 · 균열의 심장부';
  logs=[];
  logM('<b style="color:#f0d67a">전성기의 기억</b> — 모든 스킬이 열려 있습니다.');
  logM('<b style="color:#e8d6a0">여명의 다섯</b>이 당신 곁에 섰다.');
  logM('하늘을 덮은 그림자가 내려앉는다. <b style="color:#a05cff">검은 태양의 용</b>.');
  toast('WASD 이동 · 1~6 스킬');
  showScreen('game'); refreshHud(); renderSkillBar();
}

function heroSay(id,line){
  const h=heroById(id); if(!h) return;
  logM('<b style="color:'+(h.aura||'#f0d67a')+'">'+h.n+' · '+h.ep+'</b> — 「'+line+'」');
  const u=(W.party||[]).find(p=>p.hero===id); if(u) u.say={t:2.6,s:line};
}
function stepPrologue(dt){
  W.proT+=dt; const b=W.boss;
  PRO_LINES.forEach(L=>{ if(!L[3]&&W.proT>L[0]){ L[3]=1; heroSay(L[1],L[2]); } });
  (W.party||[]).forEach(u=>{ if(u.say){ u.say.t-=dt; if(u.say.t<=0) u.say=null; } });
  if(W.proStage===0&&W.proT>22){ W.proStage=1;
    logM('아즈라칸이 목을 낮춰 너를 내려다본다. 「이 정도였나.」'); }
  if(W.proStage===1&&W.proT>27){ W.proStage=2;
    logM('<b style="color:#ff6b6b">공허가 열립니다…</b>'); toast('피할 수 없습니다'); W.shake=1.2; }
  if(W.proStage===2&&W.proT>31){ W.proStage=3; W.shake=2.0;
    addFx('bossRoar',{x:b.x,y:b.y,r:420,life:1.4});
    for(let k=0;k<70;k++) part(rnd(W.x0,W.x1),rnd(W.y0,W.y1),rnd(-40,40),rnd(-60,10),rnd(.6,1.4),'#a05cff',2);
    allUnits().forEach(u=>{ u.hp=0; u.dead=true; setAnim(u,'dead'); });
    logM('<b style="color:#ff4444">한순간에 모든 것이 꺼졌다.</b>');
    W.phase='done'; const R=W; setTimeout(()=>endPrologue(R),2200); }
}
function endPrologue(R){
  if(!R||R.finished) return; R.finished=true; running=false;
  if(PRO_BACKUP){ Object.assign(P,PRO_BACKUP); PRO_BACKUP=null; }
  const RS=RACE_STORY[P.race]||RACE_STORY.human, CS=CLASS_STORY[SPECS[P.spec].cls];
  const FN=FACTIONS[P.fac||RACES[P.race].f].n;
  storyIdx=0; PRO_MODE=true;
  FALL_SCENES=[
   {bg:'blacksun',t:RS.t+', 너는 '+FN+'의 이름을 등에 지고 있었다.\n'+RS.l+'\n'+CS},
   {bg:'blacksun',t:'너와 함께 선 다섯이 있었다. 훗날 「여명의 다섯」이라 불릴 자들.\n\n'
     +'여명의 방패 세라핀. 별을 읽는 자 카일렌.\n불의 심장 보릭. 서리검 니베인. 그림자 사냥꾼 오릭.\n\n'
     +'노래는 그 다섯의 이름만 기억한다. 여섯 번째였던 너의 이름은 어디에도 남지 않았다.'},
   {bg:'crypt',t:'검은 태양의 용이 숨을 내쉰 단 한 번에, 모든 것이 꺼졌다.\n\n이름도, 힘도, 함께 서 있던 자들도.'},
   {bg:'crypt',t:'오백 년이 지났다.\n\n납골당 바닥에서 다시 눈을 떴을 때\n남은 것은 이름 하나와 낡은 무기 한 자루뿐이었다.\n\n「되살아난 자여. 균열은 이유 없이 죽은 자를 돌려보내지 않는다.」'},
  ];
  playFall();
}
function playFall(){
  const S2=FALL_SCENES[storyIdx];
  if(!S2){ PRO_MODE=false; cancelAnimationFrame(scRaf); clearInterval(typeT);
    save(); enterCrypt(); return; }
  showScreen('story'); Music.set('intro');
  const el=$('#storyText'); el.textContent=''; clearInterval(typeT);
  let i=0; const full=S2.t;
  typeT=setInterval(()=>{ i+=2; el.textContent=full.slice(0,i); if(i>=full.length) clearInterval(typeT); },18);
  cancelAnimationFrame(scRaf); sceneLoop(S2.bg);
  $('#btnNext').textContent=(storyIdx>=FALL_SCENES.length-1)?'다시 시작한다 ▶':'계속 ▶';
}

/* 시나리오 재생기 — 도입·막간·에필로그가 같은 화면을 쓴다 */
let SR_LIST=null, SR_DONE=null, SR_I=0;
function storyRunner(list,done){
  SR_LIST=list; SR_DONE=done; SR_I=0; PRO_MODE=false; STORY_MODE='runner';
  srPlay();
}
function srPlay(){
  const S2=SR_LIST[SR_I];
  if(!S2){ STORY_MODE=null; cancelAnimationFrame(scRaf); clearInterval(typeT);
    const f=SR_DONE; SR_LIST=null; SR_DONE=null; if(f) f(); return; }
  showScreen('story'); Music.set(S2.bg==='city'?'town':'intro');
  const el=$('#storyText'); el.textContent=''; clearInterval(typeT);
  let i=0; const full=S2.t;
  typeT=setInterval(()=>{ i+=2; el.textContent=full.slice(0,i); if(i>=full.length) clearInterval(typeT); },18);
  cancelAnimationFrame(scRaf); sceneLoop(S2.bg);
  $('#btnNext').textContent=(SR_I>=SR_LIST.length-1)?'계속 ▶':'계속 ▶';
}
let STORY_MODE=null;
const SCENES=[
 {bg:'blacksun',t:`아스텔라에 검은 태양이 뜬 지 오백 년.
하늘에 뚫린 균열은 빛을 삼켰고, 왕국은 하나씩 재가 되었다.`},
 {bg:'crypt',t:`남은 것은 여명의 성채 로엔가르드, 단 하나.
그리고 그 지하 납골당에서 — 당신이 눈을 떴다.`},
 {bg:'city',t:`「되살아난 자여. 균열은 이유 없이 죽은 자를 돌려보내지 않는다.」

성문이 열리고, 오백 년 만의 빛이 눈을 찌른다.
여기서부터가 당신의 여정이다.`},
];
let storyIdx=0, typeT=null, scRaf=0;
function playScene(){
  const S2=SCENES[storyIdx];
  if(!S2){ endStory(); return; }
  Music.set(S2.bg==='city'?'town':'intro');
  const el=$('#storyText'); el.textContent=''; clearInterval(typeT);
  let i=0; typeT=setInterval(()=>{ i+=2; el.textContent=S2.t.slice(0,i);
    if(i>=S2.t.length) clearInterval(typeT); },18);
  cancelAnimationFrame(scRaf); sceneLoop(S2.bg);
}
function sceneLoop(kind){
  const c=$('#sc'), ctx=c.getContext('2d');
  const t=performance.now()/1000;
  withCtx(ctx,2,()=>{ px(0,0,320,165,'#05050a');
    if(kind==='blacksun'){
      for(let i=0;i<80;i++) px((i*97)%320,(i*53)%100,1,1,i%4?'#3a3a5a':'#6a6a9a');
      px(0,100,320,65,'#12101c');
      for(let a=0;a<6.283;a+=.05) px(160+Math.cos(a)*30,62+Math.sin(a)*30,2,2,'#5c2a6a');
      px(130,32,60,60,'#08060e');
      for(let a=0;a<6.283;a+=.12){ const r=34+Math.sin(a*3+t*2)*5;
        px(160+Math.cos(a)*r,62+Math.sin(a)*r,2,2,'#a04ac8'); }
      [[10,130],[45,112],[80,140],[120,104],[160,128],[205,138],[250,110],[290,132]]
        .forEach(([x,y],i)=>{ px(x,y,20,165-y,'#0a0812'); px(x+4,y-8-(i%3)*6,5,10,'#0a0812'); });
    } else if(kind==='crypt'){
      for(let j=0;j<165;j+=16) for(let i=0;i<320;i+=24){
        px(i,j,24,16,(i+j)%48?'#191426':'#151021'); px(i,j,24,1,'#0a0812'); }
      px(120,100,80,34,'#2a2438'); px(124,96,72,8,'#3a3450'); px(124,104,72,26,'#211b2e');
      [70,250].forEach(x=>{ px(x,110,5,24,'#241e30'); const f=Math.sin(t*7+x)*1;
        px(x+1,102+f,3,8,'#c98b2a'); px(x+1,100+f,2,4,'#ffe6b0');
        g.globalAlpha=.13; px(x-12,86,29,54,'#c98b2a'); g.globalAlpha=1; });
      drawChar({x:160,y:96,skin:CC.skin,beard:CC.beard,hair:CC.hair,hairStyle:CC.hairStyle,
        body:'#4a4a66',trim:'#8a8aa8',wpn:'none',t,anim:'idle',at:t,face:1});
    } else {
      for(let j=0;j<100;j++) px(0,j,320,1,`rgb(${lerp(12,74,j/100)|0},${lerp(10,58,j/100)|0},${lerp(24,66,j/100)|0})`);
      px(238,30,26,26,'#120c18');
      for(let a=0;a<6.283;a+=.16) px(251+Math.cos(a)*17,43+Math.sin(a)*17,2,2,'#5c2a6a');
      g.globalAlpha=.18; px(230,22,42,42,'#7a3a8a'); g.globalAlpha=1;
      for(let i=0;i<40;i++) px((i*79)%320,(i*47)%96,1,1,'#2a2438');
      for(let i=0;i<26;i++) px(40+i*3+Math.sin(i)*4,10+Math.sin(i*.8)*5,3,2,'#5c2a6a');
      for(let i=0;i<10;i++) px(i*36-10,76-((i*7)%18),46,40,'#2e2740');
      px(0,98,320,67,'#1e1a2c');
      [[24,60],[74,46],[136,36],[198,48],[252,56],[292,66]].forEach(([x,h],i)=>{
        px(x,98-h,26,h,'#2a2438'); px(x,98-h,26,3,'#3a3050');
        for(let k=0;k<9;k++) px(x+k,98-h-9+k,26-k*2,2,'#4a1f28');
        for(let r=0;r<Math.floor(h/14);r++){ const lit=(x+r)%3!==0;
          px(x+7,98-h+10+r*14,4,6,lit?'#8a6a2a':'#141020'); px(x+15,98-h+10+r*14,4,6,lit?'#7a5a24':'#141020'); }
        const f=Math.sin(t*3+i)*1.5; px(x+12,98-h-18,1,10,'#1a1626'); px(x+13,98-h-18+f,9,6,'#6a2418'); });
      for(let j=130;j<165;j+=8) for(let i=0;i<320;i+=12) px(i,j,12,8,(i+j)%24?'#241f34':'#201b2e');
      const CR=['#5a2a1e','#26365e','#22452c','#5c481c','#3f2452','#5a2440'];
      for(let i=0;i<12;i++){ const x=18+i*25+Math.sin(t*1.2+i)*3,y=140+((i*7)%12);
        px(x,y-9,4,5,CR[i%6]); px(x+1,y-13,2,3,'#e8b58a'); px(x,y-4,1,4,'#2a2438'); px(x+3,y-4,1,4,'#2a2438'); }
      for(let i=0;i<7;i++){ const x=(t*22+i*45)%340-10,y=24+(i*9)%22;
        px(x,y,2,1,'#2a2438'); px(x+2,y-1,2,1,'#2a2438'); }
    } });
  scRaf=requestAnimationFrame(()=>sceneLoop(kind));
}
function endStory(){ cancelAnimationFrame(scRaf); clearInterval(typeT);
  save(); enterCrypt(); }
$('#btnNext').onclick=()=>{
  if(STORY_MODE==='runner'){ SR_I++; srPlay(); return; }
  storyIdx++; if(PRO_MODE) playFall(); else playScene(); };
$('#btnSkipStory').onclick=()=>{
  if(STORY_MODE==='runner'){ STORY_MODE=null; cancelAnimationFrame(scRaf); clearInterval(typeT);
    const f=SR_DONE; SR_LIST=null; SR_DONE=null; if(f) f(); return; }
  if(PRO_MODE){ PRO_MODE=false; cancelAnimationFrame(scRaf);
    clearInterval(typeT); save(); enterCamp(); return; } endStory(); };

function showErr(msg){
  const b=$('#errBar'); if(!b) return;
  b.classList.remove('hide');
  b.innerHTML='<b>오류가 발생했습니다.</b> 아래 내용을 그대로 알려주시면 고칠 수 있습니다.'
    +'<div style="margin-top:5px;color:#ffe0e0;word-break:break-all">'+String(msg).replace(/</g,'&lt;')+'</div>'
    +'<div style="margin-top:6px"><button id="errClose" style="padding:4px 10px;font-size:11px">닫기</button></div>';
  const c=$('#errClose'); if(c) c.onclick=()=>b.classList.add('hide');
}
