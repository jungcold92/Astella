<meta name="apple-mobile-web-app-title" content="ASTELLA">
<meta name="application-name" content="ASTELLA">
<meta name="theme-color" content="#0b0a10">
<style>
:root{
  --gold:#c9a227; --gold2:#f0d67a; --bronze:#7a5a28; --ink:#0b0a10;
  --stone:#191723; --stone2:#221f2e; --parch:#2a2536;
  --line:#4a3d22; --txt:#e8e0cc; --dim:#8d8499;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
/* 서체 — 제목은 각진 세리프(고전 판타지), 본문은 좁고 또렷한 고딕.
   자간을 넓게 벌리면 발표 자료처럼 보인다. 바짝 붙인다. */
:root{
  --ff-title:'Trajan Pro','Cinzel','Optima','Palatino Linotype',Palatino,
             'Times New Roman','Batang','바탕',serif;
  --ff-body:'Segoe UI','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',system-ui,sans-serif;
}
html,body{margin:0;padding:0;height:100%;background:#05040a;color:var(--txt);overflow:hidden;
  font-family:var(--ff-body);overscroll-behavior:none}
#app{position:fixed;inset:0;height:100%;display:flex;flex-direction:column}
@supports(height:100dvh){ #app{height:100dvh} #ov{height:100dvh} }
canvas{image-rendering:pixelated;display:block}
.hide{display:none!important}
.dim{color:var(--dim)} .gold{color:var(--gold2)}

/* ---- 금속 프레임 공통 ---- */
.frame{position:relative;background:
   linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.30)),
   linear-gradient(180deg,var(--stone2),var(--stone));
  border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.32),
             inset 0 1px 0 rgba(255,236,180,.12),
             0 3px 10px rgba(0,0,0,.6)}
.frame::before,.frame::after{content:'';position:absolute;width:7px;height:7px;
  border:1px solid var(--gold);opacity:.75;pointer-events:none}
.frame::before{left:2px;top:2px;border-right:0;border-bottom:0}
.frame::after{right:2px;bottom:2px;border-left:0;border-top:0}

button{font-family:var(--ff-body);color:#f2e6c4;font-size:12.5px;cursor:pointer;padding:8px 15px;
  touch-action:manipulation;letter-spacing:0;
  border:1px solid #07060c;border-radius:1px;
  background:
    linear-gradient(180deg,rgba(255,240,200,.10),rgba(0,0,0,.28) 55%,rgba(0,0,0,.42)),
    linear-gradient(180deg,#3d3549,#221d2e);
  box-shadow:inset 0 0 0 1px rgba(176,140,52,.42),inset 0 1px 0 rgba(255,236,180,.18),
             0 2px 0 #07060c,0 3px 6px rgba(0,0,0,.45);
  text-shadow:0 1px 0 #000}
button:hover:not(:disabled){background:linear-gradient(180deg,#4a4160,#2c253c);
  box-shadow:inset 0 0 0 1px rgba(240,214,122,.55),inset 0 1px 0 rgba(255,236,180,.20),0 2px 0 #0a0810}
button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
button:disabled{opacity:.32;cursor:not-allowed}
button.pri{color:#fff4d0;
  background:linear-gradient(180deg,rgba(255,240,200,.16),rgba(0,0,0,.22)),
             linear-gradient(180deg,#8d6717,#472f06);
  box-shadow:inset 0 0 0 1px rgba(240,214,122,.65),inset 0 1px 0 rgba(255,242,200,.32),
             0 2px 0 #07060c,0 3px 8px rgba(140,100,20,.28)}
button.pri:hover:not(:disabled){background:linear-gradient(180deg,#a87a1c,#5f420a)}
button.gem{background:linear-gradient(180deg,#175e75,#0c3242);color:#c2f0ff;
  box-shadow:inset 0 0 0 1px rgba(90,200,235,.5),inset 0 1px 0 rgba(200,245,255,.25),0 2px 0 #0a0810}
input{font-family:var(--ff-body);color:var(--gold2);padding:10px;font-size:16px;width:100%;border-radius:1px;
  background:#0d0b14;border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.28),inset 0 2px 6px rgba(0,0,0,.7)}
input::placeholder{color:#5b5470}

/* ---- 화면 ---- */
.screen{position:absolute;inset:0;overflow:auto;display:flex;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 50% 26%,rgba(140,110,44,.10) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 30%,#171327 0%,#07060d 72%)}
.box{width:100%;max-width:420px;padding:20px}
.box h2{margin:0 0 2px;font-size:38px;letter-spacing:2px;text-align:center;
  font-family:var(--ff-title);font-weight:400;
  background:linear-gradient(180deg,#fff6d4,var(--gold) 62%,#8a6a18);-webkit-background-clip:text;
  background-clip:text;color:transparent;
  text-shadow:0 2px 14px rgba(201,162,39,.30),0 1px 0 rgba(0,0,0,.9)}
.box h2::after{content:'';display:block;height:1px;width:62%;margin:7px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.box .sb{font-size:11.5px;color:#9a8f78;text-align:center;margin-bottom:16px;
  font-family:var(--ff-title);letter-spacing:0}
.rule{height:1px;margin:12px 0;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;color:#a0977f;margin-bottom:4px;letter-spacing:0;
  font-family:var(--ff-title)}
.err{color:#ff8a8a;font-size:12px;min-height:17px;margin:7px 0;line-height:1.6}
.note{font-size:10px;line-height:1.75;color:#6f6885;margin-top:14px;
  border-top:1px solid #2a2438;padding-top:10px}

/* ---- 캐릭터 생성 ---- */
#ccWrap{display:flex;gap:10px;width:100%;max-width:1040px;flex-wrap:wrap;align-items:flex-start}
.pane{padding:12px}
.pane>.t{font-size:14px;color:var(--gold2);letter-spacing:0;margin-bottom:8px;padding-bottom:5px;
  font-family:var(--ff-title);
  border-bottom:1px solid #3a3020;text-shadow:0 1px 0 #000,0 0 8px rgba(201,162,39,.20)}
#pv{width:100%;background:#08070f;border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.25),inset 0 0 40px rgba(0,0,0,.8)}
.tiles{display:flex;gap:6px;flex-wrap:wrap}
.tile{width:84px;padding:4px;text-align:center;cursor:pointer;border-radius:2px;
  background:linear-gradient(180deg,#2a2536,#181523);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.16)}
.tile:hover{box-shadow:inset 0 0 0 1px rgba(240,214,122,.45)}
.tile.on{background:linear-gradient(180deg,#4a3a16,#2a1f08);
  box-shadow:inset 0 0 0 1px var(--gold),0 0 12px rgba(201,162,39,.30)}
.tile canvas{width:100%;height:auto;display:block}
.tile .tn{font-size:10px;margin-top:3px;color:#cfc7dd}
.tile.on .tn{color:var(--gold2)}
.ct{width:72px}.st{width:100px}
.sw{width:28px;height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;color:#d8d0e4;margin:0 5px 5px 0;border:1px solid #0a0810;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.20)}
.sw.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 8px rgba(201,162,39,.4)}
.lbl{font-size:11px;color:#a0977f;letter-spacing:0;margin:12px 0 5px;font-family:var(--ff-title)}

/* ---- 게임 HUD ---- */
#gameWrap{position:absolute;inset:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
.hudTop{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:flex-start;
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left))}
.pbox{background:linear-gradient(180deg,rgba(38,32,52,.94),rgba(12,10,18,.94));
  border:1px solid #0a0810;border-radius:2px;padding:6px 9px;font-size:11px;pointer-events:auto;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.30),0 2px 8px rgba(0,0,0,.6)}
/* 유닛 프레임 */
#unitFrame{display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px}
#portrait{width:52px;height:52px;border-radius:2px;background:#08070f;
  border:1px solid #0a0810;box-shadow:inset 0 0 0 2px var(--bronze),0 0 0 1px rgba(240,214,122,.35)}
.ufcol{min-width:150px}
.nameRow{font-size:12.5px;color:var(--gold2);text-shadow:0 1px 0 #000}
.ttl2{font-size:9.5px;color:#b9a9e0}
.gauge{height:11px;margin-top:3px;position:relative;border:1px solid #0a0810;background:#120f1a;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.22)}
.gauge>i{display:block;height:100%;
  background:linear-gradient(180deg,#5fd85f,#1e7a1e);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.gauge.mp{height:8px}.gauge.mp>i{background:linear-gradient(180deg,#6aa8f0,#1c4a9c)}
.gauge.xp{height:5px}.gauge.xp>i{background:linear-gradient(180deg,#f0d67a,#8a6418)}
.gauge>span{position:absolute;inset:0;font-size:8.5px;line-height:11px;text-align:center;
  color:#fff;text-shadow:0 1px 1px #000}
#bossBox{flex:1;max-width:360px}
.bossName{font-size:12px;color:#ffb08a;text-shadow:0 1px 0 #000}
.gauge.boss{height:14px}
.gauge.boss>i{background:linear-gradient(180deg,#e2643c,#7a2210)}
.hudRight{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:5px;
  align-items:flex-end;pointer-events:auto;max-width:46%}
.chip{background:linear-gradient(180deg,rgba(38,32,52,.94),rgba(12,10,18,.94));
  border:1px solid #0a0810;padding:4px 9px;font-size:11px;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.30)}
.menuBtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mb{width:38px;height:38px;padding:0;font-size:15px;display:flex;align-items:center;justify-content:center}
/* 목표 트래커 */
#objBox{margin-top:2px;max-width:230px;text-align:left}
#objBox .oh{font-size:11px;color:var(--gold);letter-spacing:0;font-family:var(--ff-title);
  border-bottom:1px solid #3a3020;
  padding-bottom:3px;margin-bottom:4px}
#objBox .ot{font-size:11px;line-height:1.55;color:#e0d8c0}
#objBox .os{font-size:9.5px;color:#8d8499;margin-top:3px}
.hudBottom{position:absolute;left:0;right:0;bottom:0;display:flex;
  padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  justify-content:space-between;align-items:flex-end;pointer-events:none;gap:8px}
#stick{width:120px;height:120px;pointer-events:auto;position:relative;flex:0 0 auto}
#stick .ring{position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(201,162,39,.30);background:radial-gradient(circle,rgba(20,16,30,.35),transparent 70%)}
#stick .nub{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(240,214,122,.45),rgba(80,64,30,.35));
  border:2px solid rgba(240,214,122,.55)}
/* 액션바 */
.skills{display:flex;gap:4px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:76%}
.sk{width:50px;height:50px;position:relative;border-radius:2px;display:flex;
  align-items:center;justify-content:center;border:1px solid #0a0810;
  background:linear-gradient(180deg,#332c44,#15121e);
  box-shadow:inset 0 0 0 2px #5c4620,inset 0 1px 0 rgba(255,236,180,.18),0 2px 0 #0a0810}
.sk canvas{width:34px;height:34px}
.sk .kn{position:absolute;top:1px;left:4px;font-size:9.5px;color:var(--gold2);text-shadow:0 1px 0 #000}
.sk .cd{position:absolute;inset:0;background:rgba(4,4,10,.74);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:16px;border-radius:2px}
.sk.lock{opacity:.30;filter:grayscale(1)}
.sk.rdy{box-shadow:inset 0 0 0 2px var(--gold),inset 0 1px 0 rgba(255,236,180,.25),
  0 0 10px rgba(201,162,39,.35),0 2px 0 #0a0810}
#interact{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(148px + env(safe-area-inset-bottom));pointer-events:auto;
  background:linear-gradient(180deg,#6b4c12,#33230a);color:#ffeec0;padding:10px 20px;font-size:13px;
  border:1px solid #0a0810;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(240,214,122,.6),0 2px 10px rgba(0,0,0,.6)}
#toastBox{position:absolute;left:50%;transform:translateX(-50%);top:calc(86px + env(safe-area-inset-top));pointer-events:none;
  display:flex;flex-direction:column;gap:5px;align-items:center}
.toast{background:linear-gradient(180deg,rgba(58,44,14,.96),rgba(24,16,4,.96));
  border:1px solid #0a0810;padding:8px 16px;font-size:12px;color:#ffeec0;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(240,214,122,.5)}
#logBox{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(142px + env(safe-area-inset-bottom));width:min(44%,320px);max-height:104px;overflow:hidden;
  font-size:10.5px;line-height:1.55;color:#b3aac6;pointer-events:none;text-shadow:0 1px 2px #000}

/* ---- 오버레이 창 ---- */
#ov{position:fixed;inset:0;background:rgba(3,2,8,.86);z-index:20;display:flex;
  align-items:center;justify-content:center;padding:10px;
  overscroll-behavior:contain}
.win{width:100%;max-width:920px;max-height:100%;display:flex;flex-direction:column;border-radius:2px;
  min-height:0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(120,96,40,.14),transparent 60%),
    linear-gradient(180deg,#221d2d,#100e18);
  border:1px solid #07060c;
  box-shadow:inset 0 0 0 2px #5c4620,inset 0 0 0 3px rgba(255,236,180,.09),
             inset 0 0 60px rgba(0,0,0,.55),0 12px 44px rgba(0,0,0,.85)}
.winH{display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px 14px;
  border-bottom:1px solid #3a3020;position:relative;
  background:linear-gradient(180deg,rgba(112,86,30,.42),rgba(0,0,0,.18))}
.winH::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,214,122,.55),transparent)}
.winH h3{margin:0;font-size:19px;letter-spacing:0;flex:1;color:var(--gold2);
  font-family:var(--ff-title);font-weight:400;
  text-shadow:0 1px 0 #000,0 0 10px rgba(201,162,39,.22)}
.winB{padding:13px;overflow:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
#ovClose{min-width:46px;height:38px;font-size:15px;padding:0 12px;flex:0 0 auto}
.winF{display:none;flex:0 0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid #3a3020;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.5))}
.winF>button{width:100%;padding:13px;font-size:14px}
/* 화면에 고정된 닫기 — 목록이 아무리 길어도 항상 같은 자리에 있다 */
#ovFloat{position:fixed;z-index:40;display:none;
  right:calc(10px + env(safe-area-inset-right));
  bottom:calc(14px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;font-size:22px;padding:0;
  background:linear-gradient(180deg,#8d6717,#422c05);color:#fff4d0;
  box-shadow:inset 0 0 0 2px rgba(240,214,122,.7),0 4px 14px rgba(0,0,0,.7)}
.cols{display:flex;gap:11px;flex-wrap:wrap}
.c1{flex:1;min-width:230px}
.sect{font-size:14px;color:var(--gold2);letter-spacing:0;margin-bottom:7px;
  font-family:var(--ff-title);position:relative;
  border-bottom:1px solid #3a3020;padding-bottom:4px;text-shadow:0 1px 0 #000}
.sect::before{content:'◆';font-size:7px;color:var(--gold);opacity:.7;
  margin-right:6px;vertical-align:2px;font-family:var(--ff-body)}

/* 장비 인형 */
.doll{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:0 auto}
.eqs{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;border-radius:2px;border:1px solid #0a0810;
  background:linear-gradient(180deg,#242032,#141220);
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.22)}
.eqs canvas{width:36px;height:36px}
.eqs .en{font-size:8.5px;color:#7b7291;position:absolute;bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px}
.cell{width:100%;padding-top:100%;position:relative;cursor:pointer;border-radius:2px;
  border:1px solid #0a0810;background:linear-gradient(180deg,#242032,#141220);
  box-shadow:inset 0 0 0 2px #3a3348}
.cell canvas{position:absolute;left:9%;top:9%;width:82%;height:82%}
.cell .up{position:absolute;top:1px;right:3px;color:#6fe86f;font-size:11px;z-index:2;text-shadow:0 1px 0 #000}
.cell.rn0{box-shadow:inset 0 0 0 2px #6a6a78}
.cell.rn1{box-shadow:inset 0 0 0 2px #2f9c2f}
.cell.rn2{box-shadow:inset 0 0 0 2px #2f74c8}
.cell.rn3{box-shadow:inset 0 0 0 2px #8a3ac8}
.cell.rn4{box-shadow:inset 0 0 0 2px #d8821a,0 0 10px rgba(216,130,26,.35)}
.eqs.rn4{box-shadow:inset 0 0 0 2px #d8821a}
.tipbox{padding:10px;font-size:11px;line-height:1.7;border-radius:2px;
  /* 옵션 수에 따라 칸이 늘었다 줄었다 하며 화면이 흔들리지 않도록 높이를 고정한다 */
  height:196px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(180deg,#1b1826,#100e18);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.20)}
.tipbox::-webkit-scrollbar{width:6px}
.tipbox::-webkit-scrollbar-thumb{background:#3a3450;border-radius:3px}

/* 스킬트리 */
.tree{position:relative;min-height:340px;border-radius:2px;overflow:auto;
  background:radial-gradient(ellipse at 50% 0%,#1c1830,#0c0a14);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.20)}
.treeWrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;overscroll-behavior-x:contain}
.tree{position:relative}
.tnode{position:absolute;width:62px;text-align:center;cursor:pointer}
.tnode canvas{width:46px;height:46px;border-radius:3px;border:1px solid #0a0810;background:#0e0c16;
  box-shadow:inset 0 0 0 2px #443a20}
.tnode.got canvas{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(201,162,39,.45)}
.tnode.lock canvas{opacity:.35;filter:grayscale(1)}
.tnode .nn{font-size:9px;margin-top:2px;color:#9a92b2}
.tnode.got .nn{color:var(--gold2)}
.treeline{position:absolute;background:#3a3020;height:2px;transform-origin:0 50%}
.runeRow{display:flex;gap:5px;margin:3px 0 11px;flex-wrap:wrap}
.rune{flex:1;min-width:124px;padding:7px;font-size:10px;line-height:1.55;cursor:pointer;border-radius:2px;
  background:linear-gradient(180deg,#221e30,#131120);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.16)}
.rune:hover{box-shadow:inset 0 0 0 1px rgba(240,214,122,.45)}
.rune.on{box-shadow:inset 0 0 0 2px #4a8ae0,0 0 10px rgba(74,138,224,.28);background:linear-gradient(180deg,#16223a,#0e1526)}
.rune.lock{opacity:.30;cursor:not-allowed}
.rune .rt{color:#8fc0ff;font-size:11px}

/* 상점 · 목록 */
.shopTabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.shopTabs button{padding:7px 12px;font-size:12px}
.shopTabs button.on{background:linear-gradient(180deg,#8a6418,#4d3608);color:#ffeec0;
  box-shadow:inset 0 0 0 1px rgba(240,214,122,.6)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.sc{padding:9px;text-align:center;font-size:10.5px;border-radius:2px;
  background:linear-gradient(180deg,#221e30,#131120);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.18)}
.sc canvas{width:64px;height:64px;margin:0 auto 5px;background:#0c0a14;border:1px solid #0a0810}
.sc.own{box-shadow:inset 0 0 0 2px #2f9c2f}
.li{padding:9px 12px;margin-bottom:6px;font-size:11.5px;line-height:1.62;border-radius:1px;
  background:linear-gradient(180deg,#221e30,#131120);border:1px solid #07060c;
  border-left:2px solid #5c4620;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.13)}
.li.done{box-shadow:inset 0 0 0 2px #2f9c2f}
.pb{height:7px;margin-top:5px;background:#120f1a;border:1px solid #0a0810}
.pb>i{display:block;height:100%;background:linear-gradient(180deg,#f0d67a,#8a6418)}
table.st2{width:100%;font-size:11px;border-collapse:collapse}
table.st2 td{padding:3px 3px;border-bottom:1px solid rgba(255,255,255,.04)}
table.st2 td:last-child{text-align:right;color:#ffe6b0}
.tag{font-size:10px;padding:1px 7px;border:1px solid #4a3d22;color:#b6a97f;margin-left:5px;
  border-radius:1px;background:rgba(0,0,0,.35);vertical-align:1px}
a.link{color:#8fc0ff;cursor:pointer;text-decoration:underline;font-size:11px}
.statline{font-size:11px;color:#a49bbb;line-height:1.7}
/* 마을 선택 카드 */
.townGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{padding:10px;cursor:pointer;border-radius:2px;text-align:center;
  background:linear-gradient(180deg,#241f31,#12101a);border:1px solid #0a0810;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.20)}
.tc:hover{box-shadow:inset 0 0 0 1px rgba(240,214,122,.55)}
.tc.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px rgba(201,162,39,.3)}
.tc canvas{width:100%;height:auto;border:1px solid #0a0810;background:#0a0812}
.tc .tn2{font-size:13px;color:var(--gold2);margin-top:6px}
.tc .td2{font-size:10.5px;color:#9a92b2;line-height:1.6;margin-top:4px;text-align:left}
@media(max-width:720px){
  .win{max-height:98vh}.winB{padding:9px}
  .sk{width:42px;height:42px}.sk canvas{width:28px;height:28px}
  #stick{width:106px;height:106px}#stick .nub{width:42px;height:42px;left:32px;top:32px}
  #logBox{width:42%;bottom:132px;max-height:64px}
  .ufcol{min-width:112px}#portrait{width:44px;height:44px}
  .mb{width:34px;height:34px;font-size:14px}
  #objBox{max-width:170px}
}
/* ── 세로로 긴 화면(폰 세로) ──
   전에는 PC용 배치가 그대로 얹혀서 패널이 화면을 반쯤 덮고,
   무대는 위로 쏠린 채 아래가 텅 비었다. 세로 전용으로 다시 짠다. */
@media(max-aspect-ratio:3/4){
  .hudTop{gap:5px;padding:calc(5px + env(safe-area-inset-top)) 6px 5px 6px}
  .pbox{padding:4px 7px;font-size:10px}
  #portrait{width:34px;height:34px}
  #unitFrame{gap:5px;padding:4px 7px 4px 4px}
  .ufcol{min-width:0;flex:1}
  .nameRow{font-size:11px}.ttl2{font-size:8.5px}
  .gauge{height:9px}.gauge.mp{height:7px}.gauge.xp{height:4px}
  .gauge>span{font-size:7.5px;line-height:9px}
  #bossBox{max-width:none}
  /* 와우식 배치 — 위: 내 정보·보스 / 오른쪽 위: 재화·메뉴 / 아래: 조이스틱 + 행동 단축바 */
  .hudRight{top:calc(4px + env(safe-area-inset-top));bottom:auto;right:5px;max-width:44%;gap:3px}
  .chip{font-size:9.5px;padding:3px 7px}
  #dpsBox{font-size:8.5px;max-height:88px;overflow:hidden;opacity:.9}
  #objBox{max-width:148px;font-size:9.5px}
  .menuBtns{gap:3px;max-width:150px}
  .mb{width:33px;height:33px;font-size:13px}
  #logBox{left:6px;width:52%;bottom:calc(158px + env(safe-area-inset-bottom));
    max-height:46px;font-size:9.5px}
  /* 행동 단축바 — 아래 오른쪽에 2줄로 딱 떨어지게 */
  .hudBottom{padding:0 6px calc(8px + env(safe-area-inset-bottom)) 6px;gap:6px;align-items:flex-end}
  .skills{max-width:none;flex:1;gap:4px;justify-content:flex-end}
  .sk{width:40px;height:40px}.sk canvas{width:26px;height:26px}
  .sk .kn{font-size:8px}
  #stick{width:96px;height:96px;flex:0 0 96px}
  #stick .nub{width:40px;height:40px;left:28px;top:28px}
  #interact{bottom:calc(150px + env(safe-area-inset-bottom));font-size:11.5px;padding:7px 14px}
  #toastBox{top:calc(58px + env(safe-area-inset-top))}
  .toast{font-size:10.5px;padding:5px 9px}
  #storyText{font-size:13.5px;line-height:1.8}
}
/* ── 모바일 세로 : 창을 전체화면 시트로 ──
   예전에는 가운데 떠 있는 창이 화면보다 커져 닫기 버튼이 위로 밀려 나갔다. */
@media(max-aspect-ratio:3/4){
  #ov{padding:0;align-items:stretch;justify-content:stretch}
  .win{max-width:none;max-height:none;height:100%;border-radius:0;border:0;
    box-shadow:inset 0 0 0 2px #5c4620}
  .winH{position:sticky;top:0;z-index:2;
    padding:calc(9px + env(safe-area-inset-top)) 12px 9px 12px}
  .winH h3{font-size:16px}
  #ovSub{display:none}
  #ovClose{min-width:52px;height:44px;font-size:17px}
  .winB{padding:11px 11px 4px}
  .winF{display:block}                      /* 아래쪽에도 큰 닫기 버튼 */
  .cols{gap:9px}.c1{min-width:0;flex:1 1 100%}
  .sgrid{gap:6px}
  .li{padding:8px 10px;font-size:11px}
  .tipbox{height:150px}
}
/* 손가락으로 하는 기기 — 세로든 가로든 떠 있는 닫기를 띄운다 */
@media(hover:none) and (pointer:coarse){
  #ovFloat{display:block}
  .winH{padding-top:max(12px,env(safe-area-inset-top))}
  #ovClose{min-width:52px;height:44px;font-size:17px}
}
@media(max-width:900px) and (orientation:portrait){
  #ovFloat{display:block}
  .win{max-width:none;max-height:none;height:100%;border-radius:0;border:0}
  #ov{padding:0}
  .winF{display:block}
}
/* 아주 좁은 화면 */

<script>
"use strict";
/* ==========================================================================
   ASTELLA v4 — 모바일 대응 단일 파일 빌드
   ▸ 계정/로그인 + 캐릭터 영속 저장 (localStorage, 실패 시 메모리 폴백)
   ▸ 걸어다니는 마을 + NPC + 던전 탐험 + 보스 레이드
   ▸ 캐릭터/몹/보스 모션(대기·이동·공격·시전·피격·사망)
   ▸ 아이템 아이콘 · 비주얼 인벤토리 · 스킬트리 · 상점(꾸미기/탈것)
   ▸ 임무 · 업적 · 칭호 · 보스 전용 드랍
   ▸ 자동전투는 "편의 기능"으로만 동작하도록 명시적 페널티 부여
   ========================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const lerp=(a,b,t)=>a+(b-a)*t;
const now=()=>Date.now();

/* ---- 저장소: localStorage 를 쓰되 차단된 환경에서도 죽지 않게 폴백 ---- */
const Store=(()=>{ let mem={}, ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return { ok, get(k){ try{ return ok?localStorage.getItem(k):mem[k]; }catch(e){ return mem[k]; } },
    set(k,v){ try{ ok?localStorage.setItem(k,v):(mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok?localStorage.removeItem(k):delete mem[k]; }catch(e){ delete mem[k]; } } };
})();

/* 수치 스쿼시 —
   와우가 「스탯 압축」으로 겪은 문제와 같다. 레벨당 복리로 불어나면
   후반에 숫자가 읽히지 않고, 한 티어만 앞서도 콘텐츠가 무너진다.
   지수를 거의 없애고 선형에 가깝게 눕혀 타격이 수백~수천대에 머물게 한다. */
const BAL={ BUDGET_PER_ILVL:0.46, PRIMARY_SHARE:.55, STAMINA_SHARE:.20, SECONDARY_SHARE:.25,
  AP_PER_STR:1.05, AP_PER_AGI:1.00, SP_PER_INT:1.26, HP_PER_STA:16, HP_BASE:900,
  CRIT_BASE:5, CRIT_PER_RATING:1/9, CRIT_PER_AGI:1/70, HASTE_PER_RATING:1/11,

const AUTO_TIER={tut:{d:1.00,r:0.30},r1:{d:0.98,r:0.26},r2:{d:0.74,r:0.72},r3:{d:0.50,r:1.25},

const autoTier=()=>(typeof W!=='undefined'&&W&&W.raid&&AUTO_TIER[W.raid.id])||AUTO_TIER.r1;

const autoReact=()=>autoTier().r;

/* 관문 — 보스방까지 가는 길. 단계마다 성격이 다르다.
   그냥 잡몹 두 무리가 아니라 「전초 → 정예 → 미니보스 → 최후의 문」이다. */
const GATES=[
 {n:'외곽 초소',   d:'흩어진 보초를 정리한다',      c:1.00,elite:0,mini:0},
 {n:'무너진 회랑', d:'좁은 길에서 몰려온다',        c:1.15,elite:1,mini:0},

 {n:'최후의 문',   d:'보스방으로 통하는 문이 열린다',c:0.00,elite:0,mini:0},
];
const gateCount=()=>GATES.length-1;                 // 마지막은 문이므로 전투 없음

const RARITY=[{n:'일반',c:'#c8c8d4',mult:1.00,affix:1},{n:'고급',c:'#4ce04c',mult:1.18,affix:2},
  {n:'희귀',c:'#4aa8ff',mult:1.38,affix:3},{n:'영웅',c:'#c05cff',mult:1.62,affix:4},

/* ---------------- 종족 ---------------- */

 dawn:{n:'여명 서약',em:'dawn',c:'#e0b84a',motto:'성벽은 아직 서 있다',
   d:'검은 태양이 뜬 뒤에도 성벽을 지켜낸 자들. 질서와 방벽, 그리고 오백 년의 고집.\n균열을 「막아야 할 상처」로 본다.'},

/* 종족 외형 특징 — 피부색뿐 아니라 실루엣으로 구분되게 한다.
   dy:키(음수=큼) sh:어깨폭 ear:귀 tusk:엄니 horn:뿔 tail:꼬리 glow:눈빛 crack:균열무늬 */
const RACE_BODY={
 human   :{dy:0, sh:0, ear:0},
 highelf :{dy:-2,sh:-1,ear:3, slim:1},
 dwarf   :{dy:3, sh:2, ear:0, stout:1, beardMin:1},
 stonekin:{dy:-1,sh:3, ear:0, stone:1},
 orc     :{dy:-2,sh:3, ear:2, tusk:1, hunch:1},
 revenant:{dy:0, sh:0, ear:1, glow:'#a05cff', wisp:1},
 sauran  :{dy:-1,sh:1, ear:0, horn:1, tail:1, scale:1},
 ashborn :{dy:1, sh:-1,ear:1, crack:'#ff6a2a', gaunt:1},
 bonewarden:{dy:-1,sh:2, bone:1, glow:'#d8e8f0'},
 frostbound:{dy:0, sh:1, ear:1, frost:1, glow:'#7fd8ff', gaunt:1},
};
function drawRaceBody(X,Y,race,skin,hair,t){
  const B=RACE_BODY[race]||RACE_BODY.human;
  if(B.ear){ const e=B.ear;
    px(X+2-(e>2?1:0),Y+5,1,2+e,skin); px(X+13+(e>2?0:0),Y+5,1,2+e,skin);
    if(e>=3){ px(X+1,Y+3,1,3,skin); px(X+14,Y+3,1,3,skin);
              px(X+1,Y+2,1,2,sh(skin,-18)); px(X+14,Y+2,1,2,sh(skin,-18)); } }
  if(B.tusk){ px(X+5,Y+8,1,3,'#e8e0c8'); px(X+10,Y+8,1,3,'#e8e0c8');
    px(X+5,Y+11,1,1,'#c8c0a8'); px(X+10,Y+11,1,1,'#c8c0a8'); }
  if(B.horn){ px(X+3,Y+1,2,3,'#c8b08a'); px(X+2,Y-1,2,3,'#d8c09a');
              px(X+11,Y+1,2,3,'#c8b08a'); px(X+12,Y-1,2,3,'#d8c09a'); }
  if(B.scale){ for(let k=0;k<4;k++) px(X+6+((k%2)?1:0),Y+1+k,1,1,sh(skin,-30)); }
  if(B.tail){ const w=Math.sin(t*3)*2;
    for(let k=0;k<7;k++) px(X-2-k+w*(k/7),Y+18+k*0.6,2,2,sh(skin,-12-k*2)); }
  if(B.stone){ px(X+3,Y+10,2,3,sh(skin,-28)); px(X+11,Y+10,2,3,sh(skin,-28));
    px(X+4,Y+6,1,1,sh(skin,22)); px(X+11,Y+7,1,1,sh(skin,22));
    px(X+2,Y+11,1,4,sh(skin,-34)); px(X+13,Y+11,1,4,sh(skin,-34)); }
  if(B.crack){ const g2=.55+.45*Math.sin(t*2.2);
    g.globalAlpha=g2; px(X+5,Y+7,1,2,B.crack); px(X+10,Y+8,1,2,B.crack);
    px(X+6,Y+12,1,3,B.crack); px(X+9,Y+14,1,2,B.crack); g.globalAlpha=1; }
  if(B.glow){ const g2=.5+.5*Math.sin(t*3);
    g.globalAlpha=g2; px(X+5,Y+6,2,1,B.glow); px(X+9,Y+6,2,1,B.glow); g.globalAlpha=1; }
  if(B.wisp){ for(let k=0;k<3;k++){ const a=t*1.6+k*2.1;
    g.globalAlpha=.35; px(X+8+Math.cos(a)*9,Y+10+Math.sin(a)*7,2,2,'#a05cff'); g.globalAlpha=1; } }
  if(B.gaunt){ px(X+4,Y+11,1,4,sh(skin,-30)); px(X+11,Y+11,1,4,sh(skin,-30)); }
  if(B.bone){
    px(X+5,Y+7,1,2,sh(skin,-45)); px(X+10,Y+7,1,2,sh(skin,-45));
    for(let k=0;k<4;k++) px(X+6+k,Y+9,1,1,sh(skin,-40));
    px(X+6,Y+8,4,1,sh(skin,25));
    px(X+2,Y+11,2,4,sh(skin,-20)); px(X+12,Y+11,2,4,sh(skin,-20));
    px(X+4,Y+13,8,1,sh(skin,-35)); px(X+4,Y+15,8,1,sh(skin,-35)); }
  if(B.frost){
    px(X+2,Y+9,2,3,'#bfe8ff'); px(X+12,Y+9,2,3,'#bfe8ff');
    px(X+1,Y+11,1,2,'#8fd8ff'); px(X+14,Y+11,1,2,'#8fd8ff');
    for(let k=0;k<3;k++){ const a=t*1.4+k*2.1;
      g.globalAlpha=.30; px(X+8+Math.cos(a)*7,Y+8+Math.sin(a)*5,1,1,'#d8f4ff'); g.globalAlpha=1; }
    px(X+5,Y+13,6,1,'#bfe8ff'); }
}

const WMODELS={
 str :[['대검','greatsword'],['전투도끼','axe'],['전쟁망치','hammer'],['장창','spear'],
       ['한손검','sword'],['탑 방패','shield']],

WMODELS.holy   =[['전쟁망치','hammer'],['한손검','sword'],['탑 방패','shield'],['장창','spear']];
const wpool=(prim,cls)=>cls==='deathknight'?WMODELS.rune
  :cls==='rogue'?WMODELS.shadowy
  :cls==='paladin'?WMODELS.holy

function genItem(ilvl,bias,slotId,prim,forceR){
  let r=forceR;
  if(r===undefined){ let roll=Math.random(),acc=0;
    const tb=[[.42,.34,.18,.05,.01,0],[.10,.34,.36,.17,.03,0],[0,.16,.38,.36,.09,.01],
              [0,.05,.28,.47,.18,.02]][clamp(bias,0,3)];
    r=0; for(let i=0;i<tb.length;i++){acc+=tb[i]; if(roll<=acc){r=i;break;}} }
  const rar=RARITY[r], slot=slotId||pick(SLOTS)[0];
  const budget=ilvl*BAL.BUDGET_PER_ILVL*rar.mult*Math.pow(ILVL_EXP,ilvl-60)*(SLOT_BUDGET[slot]||1);
  const st={str:0,int:0,agi:0,sta:0,spi:0,critR:0,hasteR:0};
  st[prim]+=Math.round(budget*BAL.PRIMARY_SHARE);
  st.sta  +=Math.round(budget*BAL.STAMINA_SHARE);
  const nSec=Math.min(rar.affix,3), sb=budget*BAL.SECONDARY_SHARE;
  ['critR','hasteR','spi'].sort(()=>Math.random()-.5).slice(0,nSec)
    .forEach(k=>st[k]+=Math.round(sb/nSec*rnd(.75,1.25)));
  let m=0, wtype=null, baseN;
  if(slot==='weapon'){
    const cls=(typeof P!=='undefined'&&P&&P.spec&&SPECS[P.spec])?SPECS[P.spec].cls:null;
    const pool=wpool(prim,cls); m=rint(0,pool.length-1);
    baseN=pool[m][0]; wtype=pool[m][1];
  } else { const pool=BASE[slot]; m=rint(0,pool.length-1); baseN=pool[m]; }
  const name=(r>=1?pick(PREFIX)+' ':'')+baseN+(r>=2?' — '+pick(SUFFIX)+'의':'');
  const setId=(r>=2&&Math.random()<0.42)?pick(ITEM_SETS).id:null;
  return {uid:UID++,name,slot,ilvl:Math.round(ilvl),r,st,up:0,set:setId,m,w:wtype,
    wp:slot==='weapon'?Math.round(ilvl*BAL.WEAPON_POWER*rar.mult):0,
    leg:r>=4?pick(LEGEND):null};
}

/* 스킬을 주는 자리: 갈래-단계 */
const TREE_SKILL={a2:'CLASS0',b2:'dash',b4:'defy',c3:'CLASS1',cap:'CLASS2'};
const TREE_CAP={n:'정점',d:'모든 피해 +10%, 직업 고유 스킬 해금',m:{all:1.10}};
function treeTotal(){ return Math.max(0,Math.min(11,(P.rank||1)-1)); }
function treeSpent(){ return Object.keys(P.tree||{}).length; }
function treeLeft(){ return treeTotal()-treeSpent(); }
function nodeId(b,t){ return b+t; }
function branchCount(b){ let n=0; for(const k in (P.tree||{})) if(k[0]===b) n++; return n; }
function canLearn(id){
  if((P.tree||{})[id]) return false;
  if(treeLeft()<=0) return false;
  if(id==='cap') return treeSpent()>=8;
  const b=id[0], t=+id[1];
  return branchCount(b)>=t-1;
}
function learnNode(id){
  if(!canLearn(id)) return false;
  P.tree=P.tree||{}; P.tree[id]=1;
  const sk=TREE_SKILL[id];
  if(sk){ const key=sk.startsWith('CLASS')?CLASS_EXTRA[SPECS[P.spec].cls][+sk[5]]:sk;
    P.pool=P.pool||[]; if(!P.pool.includes(key)) P.pool.push(key); }
  return true;
}
function resetTree(){ P.tree={}; P.pool=[]; P.slots=[null,null,null,null]; }
function treeMods(){
  const M={};
  for(const id in (P.tree||{})){
    let m=null;
    if(id==='cap') m=TREE_CAP.m;
    else { const br=TREE_BRANCH.find(x=>x.id===id[0]); if(br) m=br.nodes[+id[1]-1].m; }
    if(!m) continue;
    for(const k in m){ if(['haste','critDmg','critAdd'].includes(k)) M[k]=(M[k]||0)+m[k];
      else M[k]=(M[k]||1)*m[k]; }
  }
  return M;
}
/* 사용 스킬 6칸: 0~3 전문화 고유, 4~5 트리로 얻은 것 중 선택 */
function skillAt(i){
  if(i<6) return SPECS[P.spec].skills[i];
  const id=(P.slots||[])[i-6]; return id?EXTRA[id]:null;
}
function runeAt(i){
  const sk=skillAt(i); if(!sk) return {n:'',d:'',m:{}};
  if(i>=6) return sk.runes[0];
  const pick2=((P.runes||[])[i])|0;
  return sk.runes[Math.min(pick2,sk.runes.length-1)];
}
function skillOpen(i){
  if(i<6) return P.rank>=SKILL_RANK[i];
  return P.rank>=SLOT_RANK[i-6]&&!!(P.slots||[])[i-6];
}
const slotCount=()=>SLOT_RANK.filter(r=>P.rank>=r).length;

const pasSlots =()=>P.rank>=10?3:P.rank>=8?2:P.rank>=5?1:0;

/* 준비물 버프 — 원정에 들어갈 때 한 번 발라진다 */
function prepMods(){
  const m={hp:1,all:1,dr:1,critAdd:0,haste:0};
  if(!P.prep) return m;
  ['food','oil'].forEach(k=>{ const c=conById(P.prep[k]); if(!c||!(P.sup&&P.sup[c.id]>0)) return;
    for(const q in c.m){ if(q==='critAdd'||q==='haste') m[q]+=c.m[q]; else m[q]*=c.m[q]; } });
  return m;
}
function calcMods(){
  const M={secondary:1,primary:1,haste:0,hp:1,dr:1,critDmg:0,critAdd:0,cost:1,dot:1,aoe:1,single:1,
    all:1,cast:1,instant:1,exec:1,execHi:1,opener:1,late:1,cdr:1,ultCdr:1,moveCast:false,
    healRecv:1,echo:0,critMana:0,lowHp:1,sk0:1,reset1:0,dotDur:1};
  const ADD=['haste','critDmg','critAdd','echo','critMana'];
  const rm=RACES[P.race].m;
  for(const k in rm){ const v=rm[k];
    if(typeof v==='boolean') M[k]=M[k]||v; else ADD.includes(k)?M[k]+=v:M[k]*=v; }
  P.passives.slice(0,pasSlots()).forEach(pid=>{ const p=PASSIVES.find(x=>x.id===pid); if(!p) return;
    for(const k in p.m) ADD.includes(k)?M[k]+=p.m[k]:M[k]*=p.m[k]; });
  SLOTS.forEach(([s])=>{ const it=P.equip[s]; if(!it||!it.leg) return;
    for(const k in it.leg.m){ const v=it.leg.m[k];
      if(typeof v==='boolean') M[k]=M[k]||v; else ADD.includes(k)?M[k]+=v:M[k]*=v; } });
  // 세트 보너스
  const cnt={}; SLOTS.forEach(([sl])=>{ const it=P.equip[sl]; if(it&&it.set) cnt[it.set]=(cnt[it.set]||0)+1; });
  for(const sid in cnt){ const st=ITEM_SETS.find(x=>x.id===sid); if(!st) continue;
    SET_TIERS.forEach(t=>{ if(cnt[sid]<t) return;               // 2·4·6·9 가 겹쳐 쌓인다
      const bon=st['b'+t]; if(!bon) return;
      for(const k in bon){ if(['haste','critDmg','critAdd'].includes(k)) M[k]+=bon[k]; else M[k]*=bon[k]; } }); }
  const TM=treeMods();
  for(const k in TM){ if(['haste','critDmg','critAdd'].includes(k)) M[k]+=TM[k]; else M[k]*=TM[k]; }
  if(P.rank>=12) M.cdr*=0.92;
  const PM=prepMods();                      // 음식·강화
  M.hp*=PM.hp; M.all*=PM.all; M.dr*=PM.dr; M.critAdd+=PM.critAdd; M.haste+=PM.haste;
  return M;
}
const eff=it=>it?it.ilvl+upGain(it.up||0):0;
/* ── 자원 ──
   예전엔 모두가 「마나 100 고정」이었다. 장비를 아무리 맞춰도 통이 안 커져서
   스킬이 10개로 늘어난 뒤로는 종결 장비에서도 바닥이 났다.
   와우처럼 직업마다 자원을 나누고, 마나만 장비에 따라 통이 커지게 한다.
     · 마나(지능) — 통이 크고 천천히 찬다. 장비를 맞출수록 넉넉해진다.
     · 기력(민첩) — 통은 100 고정, 대신 아주 빨리 찬다. 장비와 무관.
     · 분노(힘)   — 평소엔 0. 때리고 맞으면서 쌓는다. 전투 밖에서는 식는다.
     · 룬 기력(사신) — 기본 회복 + 타격 시 크게 회복. 둘의 중간.
   */
const RES={
 mage:{n:'마나',c:'#4a8ad8'}, priest:{n:'마나',c:'#4a8ad8'},
 hunter:{n:'기력',c:'#e0c84a'}, rogue:{n:'기력',c:'#8fd8a0'},
 warrior:{n:'분노',c:'#d84a3a'}, paladin:{n:'신성한 힘',c:'#e0b84a'},
 deathknight:{n:'룬 기력',c:'#7fd8ff'},
};
const resOf=cls=>RES[cls]||RES.mage;
function resStats(t,M,cls){
  if(cls==='mage'||cls==='priest')
    return {max:Math.round(140+t.int*0.42+t.spi*0.30),
            reg:4.2+t.spi*0.055, onHit:0, decay:0};
  if(cls==='hunter'||cls==='rogue')
    return {max:100, reg:13, onHit:2, decay:0};
  if(cls==='deathknight')
    return {max:110, reg:5.5, onHit:9, decay:0};
  if(cls==='paladin')
    return {max:100, reg:4.0, onHit:11, decay:1.6, start:25};
  return {max:100, reg:3.2, onHit:13, decay:2.0, start:30};   // 전사 — 분노
}
function derive(){
  const sp=SPECS[P.spec], prim=CLASSES[sp.cls].prim, M=calcMods();
  const t={str:0,int:0,agi:0,sta:0,spi:0,critR:0,hasteR:0};
  let wp=0,sum=0;
  SLOTS.forEach(([s])=>{ const it=P.equip[s]; if(!it) return;
    const boost=Math.pow(ILVL_EXP,upGain(it.up||0))*(1+upGain(it.up||0)*0.012);
    for(const k in t) t[k]+=(it.st[k]||0)*boost;
    wp+=(it.wp||0)*boost; sum+=eff(it); });
  t.critR*=M.secondary; t.hasteR*=M.secondary; t.spi*=M.secondary;
  let power=(prim==='int'?t.int*BAL.SP_PER_INT+wp*1.2
              :prim==='str'?t.str*BAL.AP_PER_STR+wp*1.5
              :t.agi*BAL.AP_PER_AGI+wp*1.45)*M.primary;
  if(sp.role==='힐러') power*=0.84;      // 딜러보다는 낮지만, 혼자 사냥이 되는 수준
  const RS=resStats(t,M,CLASSES[sp.cls]?sp.cls:'mage');
  return {t,power,M,prim,wp,avgIlvl:sum/9,res:RS,resN:resOf(sp.cls),
    hp:(BAL.HP_BASE+t.sta*BAL.HP_PER_STA)*M.hp,
    crit:clamp(BAL.CRIT_BASE+t.critR*BAL.CRIT_PER_RATING+t.agi*BAL.CRIT_PER_AGI+M.critAdd,0,75),
    haste:clamp(t.hasteR*BAL.HASTE_PER_RATING+M.haste,0,65),
    critMult:Math.max(1.1,BAL.CRIT_MULT+M.critDmg)};
}
function estDps(d){
  const sp=SPECS[P.spec];
  const s0=sp.skills[0], rm=runeAt(0).m;
  const dur=Math.max(.85,((s0.cast||1)*(rm.cast||1))/(1+d.haste/100));
  return s0.coef*(rm.dmg||1)*(rm.hits||1)*d.power*(1+d.crit/100*(d.critMult-1))
    *d.M.all*d.M.single*d.M.sk0*(s0.cast?d.M.cast:d.M.instant)*(sp.role==='탱커'?.5:1)/dur;
}
function estDpsFull(d){
  const sp=SPECS[P.spec]; let total=estDps(d);
  const critF=1+d.crit/100*(d.critMult-1);
  for(let i=1;i<SKILL_N;i++){
    if(!skillOpen(i)) continue;
    const sk=skillAt(i); if(!sk) continue;
    if(sk.kind==='buff'||sk.kind==='heal'||!sk.coef) continue;
    const rm=runeAt(i).m;
    const cd=Math.max(1.2,(sk.cd||6)*(rm.cd||1)*d.M.cdr/(1+d.haste/100));
    total+=sk.coef*(rm.dmg||1)*(rm.hits||1)*d.power*critF*d.M.all/cd;
  }
  return total;
}
function myWeapon(){
  const mg=P.mog&&P.mog.weapon; if(mg&&mg.w) return mg.w;   // 모습변환된 무기
  const w=P.equip&&P.equip.weapon;
  if(w&&w.w) return w.w;                       // 실제로 낀 무기를 든다
  const c=SPECS[P.spec].cls, p=CLASSES[c].prim;
  if(c==='deathknight') return P.spec==='blooddk'?'runeaxe':'runeblade';
  if(c==='rogue') return 'dagger';
  if(c==='paladin') return P.spec==='guard'?'shield':'hammer';
  return p==='int'?'staff':p==='agi'?'bow':(P.spec==='prot'?'shield':P.spec==='fury'?'axe':'sword'); }
/* 착용 중인 방어구를 외형 데이터로 바꾼다.
   꾸미기가 이기는 것이 원칙이다 —
    · 꾸미기 투구를 쓰면 머리 장비 외형은 사라진다
    · 염색을 하면 방어구 전체가 그 색으로 통일된다(등급색 얼룩이 사라짐)
    · 「장비 외형 숨기기」를 켜면 방어구는 전부 감춰지고 꾸미기만 남는다 */
function myGear(){
  const G={}; if(!P.equip) return G;
  if(P.cos&&P.cos.hideGear) return G;                 // 완전 꾸미기 모드
  const dye=cosOf('dye'), helmC=cosOf('helm');
  const SLS=['head','shoulder','chest','hands','legs','feet'];
  P.mog=P.mog||{};
  SLS.forEach((sl,i)=>{
    if(sl==='head'&&helmC) return;                    // 꾸미기 투구가 덮는다
    const it=P.equip[sl]; if(!it) return;
    const mg=P.mog[sl];                               // 모습변환 — 능력치는 그대로, 겉모습만 교체
    const m=(mg&&mg.m!==undefined)?mg.m:(it.m|0);
    const rr=(mg&&mg.r!==undefined)?mg.r:it.r;
    const c=dye?sh(dye.v,[10,-6,0,-12,-4,-14][i]):(GEAR_TINT[rr]||'#8a8a9a');
    G[sl]={m,c}; });

function drawWeapon(hx,hy,type,ang,glow,face,wc){
  const dx=Math.cos(ang)*face, dy=Math.sin(ang), L=type==='bow'?11:13;
  const put=(t,c,w)=>px(hx+dx*t-(w||1)/2,hy+dy*t-(w||1)/2,w||1,w||1,c);
  const MT=wc||'#d0d0e0', MTL=sh(MT,40), MTD=sh(MT,-45), nx=-dy, ny=dx*face;   // 등급 금속색
  const put2=(t,off,c,w)=>px(hx+dx*t+nx*off-(w||1)/2,hy+dy*t+ny*off-(w||1)/2,w||1,w||1,c);
  if(type==='greatsword'){                          // 대검 — 폭 넓고 아주 길다
    for(let t=1;t<L+6;t++){ put2(t,-1.5,MT,3); put2(t,1.5,t>L+2?MTL:MTD,3); }
    for(let t=-3;t<2;t++) put(t,'#5a3a1a',3);
    for(let o=-4;o<=4;o++) put2(2,o,'#8a6a3a',3);
    put(L+6,'#ffffff',2); return; }
  if(type==='hammer'){                              // 망치 — 네모난 큰 머리
    for(let t=-4;t<L-3;t++) put(t,'#5a3a1a',2.4);
    for(let o=-4;o<=4;o++){ put2(L-3,o,MTD,4); put2(L-4,o,MT,4); }
    for(let o=-4;o<=4;o++) put2(L-5,o,MTL,2); return; }
  if(type==='spear'){                               // 창 — 자루가 뒤로도 길다
    for(let t=-9;t<L;t++) put(t,'#6a4a2a',2);
    for(let t=L-1;t<L+6;t++) put(t,t>L+3?'#ffffff':MT,2.4);
    for(let o=-2;o<=2;o++) put2(L-2,o,MTD,2); return; }
  if(type==='dagger'){                              // 단검 — 짧고 굽었다. 검과 확실히 다르게
    for(let t=1;t<7;t++){ const off=(t-1)*0.5;      // 살짝 휜 날
      put2(t,off,t>5?'#ffffff':MT,2); }
    put2(0,-2.5,MTD,3); put2(0,2.5,MTD,3);          // 넓적한 코등이
    put(-2,'#5a3a1a',3); put(-4,MTL,3); return; }
  if(type==='twinblade'){                           // 쌍곡도 — 두 자루가 벌어져 있다
    for(let t=2;t<10;t++){ put2(t,-4,MT,2); put2(t,4,MT,2); }
    put2(1,-4,'#5a3a1a',3); put2(1,4,'#5a3a1a',3);
    put2(10,-5,'#ffffff',2); put2(10,5,'#ffffff',2); return; }
  if(type==='crossbow'){ for(let o=-6;o<=6;o++) put2(3,o,MT,2);
    put2(-6,0,'#5a3a1a',2); for(let t=-6;t<6;t++) put(t,'#6a4a2a',2);
    for(let o=-6;o<=6;o++) put2(2,o,'#d8d0b0',1); return; }
  if(type==='tome'){ for(let o=-4;o<=4;o++){ put2(4,o,MTD,5); put2(3,o,MT,3); }
    put2(4,0,MTL,2); g.globalAlpha=.4; for(let o=-4;o<=4;o++) put2(6,o,glow,4); g.globalAlpha=1; return; }
  if(type==='orb'){ for(let t=-3;t<5;t++) put(t,'#5a3a1a',2);
    put(8,MT,7); put(8,glow,5); put(7,'#fff',2);
    g.globalAlpha=.35; put(8,glow,11); g.globalAlpha=1; return; }
  if(type==='scepter'){ for(let t=-3;t<L-3;t++) put(t,MTD,2);

  if(type==='frostblade'){ for(let t=2;t<L+4;t++) put(t,t>L+1?'#ffffff':'#d8f4ff',2);
    for(let t=4;t<L+2;t+=3) put(t,'#7fd8ff',3);

}

/* 오라 — 종류마다 형태가 다르다. 능력치와는 무관한 순수 외형. */
function drawAura(X,Y,c,fx,t,al){
  const A=v=>{ g.globalAlpha=al*v; }, cx2=X+8, cy2=Y+13;
  const L=sh(c,55), D=sh(c,-35);
  if(fx==='ember'||fx==='flame'||fx==='lava'){                 // 타오르며 위로
    A(.13+.07*Math.sin(t*5)); px(X-3,Y+4,22,20,c);
    for(let k=0;k<9;k++){ const ph=(t*1.5+k*0.37)%1;
      A(.7*(1-ph)); px(X+1+((k*47)%15),Y+20-ph*24,2,3,ph<.4?L:c); }
  } else if(fx==='shard'||fx==='ice'){                         // 궤도를 도는 얼음 조각
    A(.12+.06*Math.sin(t*3)); px(X-4,Y+3,24,22,c);
    for(let k=0;k<6;k++){ const a=t*1.6+k*1.047, rr=11+Math.sin(t*2+k)*2;
      A(.75); px(cx2+Math.cos(a)*rr,cy2+Math.sin(a)*rr*0.5,2,3,k%2?L:c); }
    A(.35); for(let a=0;a<6.28;a+=.5) px(cx2+Math.cos(a)*12,Y+21+Math.sin(a)*4,1,1,L);
  } else if(fx==='halo'||fx==='feather'){                      // 머리 위 고리 + 아래로 흐르는 빛
    A(.14+.06*Math.sin(t*2.4)); px(X-3,Y+3,22,21,c);
    A(.85); for(let a=0;a<6.28;a+=.28) px(X+8+Math.cos(a)*8,Y+1+Math.sin(a)*3,1.4,1.4,L);
    for(let k=0;k<5;k++){ const ph=(t*0.8+k*0.2)%1; A(.5*(1-ph));
      px(X+2+k*3,Y+6+ph*16,1,4,L); }
  } else if(fx==='blood'){                                     // 아래로 떨어지는 핏방울
    A(.16+.07*Math.sin(t*6)); px(X-3,Y+4,22,20,c);
    for(let k=0;k<7;k++){ const ph=(t*1.2+k*0.29)%1;
      A(.8*(1-ph*.5)); px(X+1+((k*53)%15),Y+6+ph*18,2,2+ph*2,ph>.6?D:c); }
  } else if(fx==='void'||fx==='shadow'){                       // 안으로 빨려드는 어둠
    A(.15+.08*Math.sin(t*3.4)); px(X-5,Y+1,26,26,c);
    for(let k=0;k<8;k++){ const ph=1-((t*1.1+k*0.25)%1), a=k*0.9+t;
      A(.6*ph); px(cx2+Math.cos(a)*ph*16,cy2+Math.sin(a)*ph*13,2,2,ph>.6?c:L); }
  } else if(fx==='star'){                                      // 반짝이는 별무리
    A(.10+.05*Math.sin(t*2)); px(X-4,Y+2,24,23,c);
    for(let k=0;k<10;k++){ const a=t*0.7+k*0.63, rr=9+((k*7)%7);
      const tw=Math.abs(Math.sin(t*3+k*1.3)); A(.25+.7*tw);
      const sx2=cx2+Math.cos(a)*rr, sy2=cy2+Math.sin(a)*rr*0.6;
      px(sx2,sy2,1.4,1.4,L); if(tw>.8){ px(sx2-1.6,sy2,4,1,c); px(sx2,sy2-1.6,1,4,c); } }
  } else if(fx==='dragon'){                                    // 발밑에서 솟는 용의 숨결
    A(.16+.08*Math.sin(t*4)); px(X-4,Y+6,24,19,c);
    for(let k=0;k<8;k++){ const ph=(t*1.9+k*0.32)%1, wob=Math.sin(t*4+k)*3;
      A(.75*(1-ph)); px(X+2+((k*41)%13)+wob*ph,Y+22-ph*26,3-ph*1.5,3,ph<.35?'#ffe08a':ph<.7?L:c); }
    A(.4); for(let a=0;a<6.28;a+=.4) px(cx2+Math.cos(a)*13,Y+22+Math.sin(a)*4,2,1,c);
  } else if(fx==='bolt'){                                      // 몸을 타고 흐르는 뇌전
    A(.12+.10*Math.abs(Math.sin(t*9))); px(X-3,Y+4,22,20,c);
    for(let k=0;k<4;k++){ const seed=Math.floor(t*11)+k*13;
      let bx=X+2+((seed*7)%12), by=Y+4; A(.9);
      for(let q=0;q<5;q++){ px(bx,by,1,2,q%2?L:'#fff'); bx+=((seed+q*3)%3)-1; by+=3; } }
  } else if(fx==='petal'){                                     // 흩날리는 꽃잎
    A(.10+.05*Math.sin(t*2)); px(X-3,Y+4,22,20,c);
    for(let k=0;k<9;k++){ const ph=(t*0.7+k*0.32)%1;
      A(.8*(1-ph*.4)); px(X+1+((k*37)%15)+Math.sin(t*3+k)*3,Y+2+ph*22,2,2,k%3?c:L); }
  } else {                                                     // 기본 — 부드러운 발광
    const p=.5+.5*Math.sin(t*4);
    A(.15+.11*p); px(X-3,Y+4,22,20,c); A(.09+.07*p); px(X-5,Y+1,26,26,c);
  }
  g.globalAlpha=al;
}
/* 날개 — 캐릭터 뒤에 크게 펼쳐진다 */
function drawWing(X,Y,c,fx,t,al){
  const flap=Math.sin(t*2.6), D=sh(c,-40), L=sh(c,50);
  const side=(sgn)=>{
    const bx=X+(sgn<0?4:12), by=Y+11;
    if(fx==='feather'){
      for(let k=0;k<6;k++){ const len=7+k*2.2, drop=k*2.4+flap*(1+k*.35);
        g.globalAlpha=al*(.92-k*.06);
        px(bx+sgn*(3+k*2.6)-(sgn<0?len:0),by-6+drop,len,2.6,k<3?L:c); }
      g.globalAlpha=al*.85; px(bx+sgn*2-(sgn<0?4:0),by-7,4,10,L);
    } else if(fx==='ice'){
      for(let k=0;k<5;k++){ const len=6+k*2.6, drop=k*2.8+flap*1.4;
        g.globalAlpha=al*(.55+.08*k);
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-8+drop,len,2,'#d8f4ff');
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-8+drop,len,1,c); }
      g.globalAlpha=al*.9; for(let k=0;k<3;k++) px(bx+sgn*(6+k*4),by-10+k*3+flap,2,4,L);
    } else if(fx==='shadow'){
      for(let k=0;k<6;k++){ const len=8+k*2.4, drop=k*2.2-flap*1.6;
        g.globalAlpha=al*(.62-k*.05);
        px(bx+sgn*(2+k*2.6)-(sgn<0?len:0),by-7+drop,len,3.4,k<2?c:D); }
      for(let k=0;k<4;k++){ g.globalAlpha=al*.5;
        px(bx+sgn*(10+k*3),by-4+k*4+flap*2,2,2,L); }
    } else if(fx==='flame'){
      for(let k=0;k<6;k++){ const len=7+k*2.4, drop=k*2.2+Math.sin(t*7+k)*1.6;
        g.globalAlpha=al*(.85-k*.07);
        px(bx+sgn*(3+k*2.5)-(sgn<0?len:0),by-7+drop,len,3,k<2?'#ffe08a':k<4?L:c); }
      for(let k=0;k<4;k++){ const ph=(t*2+k*0.3)%1; g.globalAlpha=al*(1-ph)*.8;
        px(bx+sgn*(8+k*4),by-8-ph*10,2,3,'#ffd06a'); }
    } else if(fx==='drake'){
      for(let k=0;k<5;k++){ const len=9+k*2.2, drop=k*3.4+flap*(1+k*.4);
        g.globalAlpha=al*.92;
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-9+drop,len,3.6,D);
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-9+drop,len,1.2,c); }
      g.globalAlpha=al; for(let k=0;k<4;k++) px(bx+sgn*(5+k*4),by-11+k*3.2+flap,1.6,3,L);
    } else {                                     // gear — 금속 날개
      for(let k=0;k<5;k++){ const len=8+k*2.2, drop=k*2.6+flap*.8;
        g.globalAlpha=al*.95;
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-8+drop,len,2.6,k%2?c:D);
        px(bx+sgn*(3+k*2.8)-(sgn<0?len:0),by-8+drop,len,1,L); }
      g.globalAlpha=al*.8;
      for(let a=0;a<6.28;a+=.9) px(bx+sgn*6+Math.cos(a+t*2)*3,by-4+Math.sin(a+t*2)*3,1.4,1.4,L);
    }
  };
  side(-1); side(1); g.globalAlpha=al;
}
const WEAR_ORDER=['legs','feet','chest','hands','shoulder','head'];
function drawWear(X,Y,gear,alpha){
  if(!gear) return;
  WEAR_ORDER.forEach(sl=>{ const it=gear[sl]; if(!it) return;
    const arr=WEAR[sl]; if(!arr) return;
    const c=it.c, f=arr[(it.m|0)%arr.length]; if(!f) return;
    f(X,Y,c,sh(c,-38),sh(c,42)); });
}

function atkKind(w){
  if(['axe','hammer','runeaxe','greatsword'].includes(w)) return 'heavy';
  if(w==='spear') return 'thrust';
  if(w==='shield') return 'bash';
  if(['staff','scepter','orb','tome'].includes(w)) return 'cast';
  if(['bow','crossbow'].includes(w)) return 'shot';
  return 'slash';
}

function withCtx(ctx,scale,fn){ const og=g,ocv=cv; g=ctx;
  g.setTransform(scale,0,0,scale,0,0); g.imageSmoothingEnabled=false; fn(); g=og; cv=ocv; }
function drawFace(ctx,race,hair,style,scale,skin,beard){
  withCtx(ctx,scale,()=>{ const R=RACES[race], sk=skin||R.skin;
    px(0,0,16,10,'#0e0c16');
    const col={H:hair,s:sk,e:'#1a1020',n:sh(sk,-40)};
    for(let r=2;r<10;r++) for(let c=0;c<16;c++){ const ch=SPR[r][c];
      if(ch==='.'||!col[ch]) continue; px(c,r-2,1,1,col[ch]); }
    drawHairStyle(0,-2,hair,style,sk);
    const B=RACE_BODY[race]||{};
    drawBeard(0,-2,sh(hair,-10),Math.max(beard||0,B.beardMin||0));
    drawRaceBody(0,-2,race,sk,hair,0);
  });
}

/* 길게 누르면 설명 — 화면에는 그림만 두고, 글은 필요할 때만 */
function longPress(el,msg){
  if(!el||!msg) return;
  let tm=null;
  const go=()=>{ tm=setTimeout(()=>{ tm=null; toast(msg); },420); };
  const off=()=>{ if(tm){ clearTimeout(tm); tm=null; } };
  el.addEventListener('touchstart',go,{passive:true});
  el.addEventListener('touchend',off); el.addEventListener('touchmove',off);
  el.addEventListener('mousedown',go); el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}

    px(0,0,16,16,'#0d0d16'); px(0,0,16,1,D); px(0,15,16,1,'#05050a');

function drawItemIcon(ctx,it,scale){
  const rc=RARITY[it.r].c, M=sh(rc,-35), L=sh(rc,45);
  withCtx(ctx,scale,()=>{
    px(0,0,16,16,'#0e0e18');
    g.globalAlpha=.14; px(1,1,14,14,rc); g.globalAlpha=1;
    if(it.slot==='weapon'){ (WICON[it.w]||WICON.sword)(rc,M,L); }
    else { const arr=ICON_ART[it.slot]||ICON_ART.trinket;
      (arr[(it.m|0)%arr.length]||arr[0])(rc,M,L); }
    px(0,0,16,1,rc); px(0,15,16,1,rc); px(0,0,1,16,rc); px(15,0,1,16,rc);
    if(it.leg){ px(1,1,2,2,'#ffd45c'); px(13,1,2,2,'#ffd45c'); }
  });
}

  const t=clamp((y-W.y0)/(W.y1-W.y0),0,1);

let joy={on:false,dx:0,dy:0,id:null};
function initInput(){
  addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys[k]=true;
    if(!$('#ov').classList.contains('hide')) return;
    if('1234567890'.includes(e.key)) useSkill((+e.key+9)%10);
    if(k==='q') usePotion();
    if(k==='e'||k===' ') doInteract();
    if(['w','a','s','d',' '].includes(k)) e.preventDefault(); });
  addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  const st=$('#stick'), nub=$('#nub');
  const set=(dx,dy)=>{ const L=Math.hypot(dx,dy); if(L>1){dx/=L;dy/=L;}
    joy.dx=dx; joy.dy=dy; nub.style.left=(36+dx*33)+'px'; nub.style.top=(36+dy*33)+'px'; };
  const at={x:0,y:0};
  const down=e=>{ const t=e.changedTouches?e.changedTouches[0]:e;
    joy.on=true; joy.id=t.identifier!==undefined?t.identifier:'m';
    const r=st.getBoundingClientRect(); at.x=r.left+r.width/2; at.y=r.top+r.height/2;
    move(e); e.preventDefault(); };
  const move=e=>{ if(!joy.on) return;
    let t=e.changedTouches?[...e.changedTouches].find(x=>x.identifier===joy.id):e;
    if(!t) return; set((t.clientX-at.x)/44,(t.clientY-at.y)/44); e.preventDefault(); };
  const up=()=>{ joy.on=false; set(0,0); };
  st.addEventListener('touchstart',down,{passive:false});
  st.addEventListener('touchmove',move,{passive:false});
  st.addEventListener('touchend',up); st.addEventListener('touchcancel',up);
  st.addEventListener('mousedown',down); addEventListener('mousemove',move); addEventListener('mouseup',up);
  const gw=$('#gameWrap'); let cd=null;
  gw.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; cd={id:t.identifier,x:t.clientX,y:t.clientY}; },{passive:true});
  gw.addEventListener('touchmove',e=>{ if(!cd) return;
    const t=[...e.changedTouches].find(x=>x.identifier===cd.id); if(!t) return;
    const dx=(t.clientX-cd.x)/40, dy=(t.clientY-cd.y)/40, L=Math.hypot(dx,dy);
    joy.dx=L>1?dx/L:dx; joy.dy=L>1?dy/L:dy; },{passive:true});
  gw.addEventListener('touchend',()=>{ if(cd){cd=null; joy.dx=joy.dy=0;} });
  addEventListener('resize',resize);
}
function moveVec(){
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx-=1; if(keys['d']||keys['arrowright'])dx+=1;
  if(keys['w']||keys['arrowup'])dy-=1; if(keys['s']||keys['arrowdown'])dy+=1;
  if(Math.abs(joy.dx)>.12||Math.abs(joy.dy)>.12){ dx+=joy.dx; dy+=joy.dy; }
  const L=Math.hypot(dx,dy); if(L>1){dx/=L;dy/=L;}
  return {dx,dy,L:Math.min(1,L)};
}

function useSkill(i){
  if(!W||W.mode!=='arena'||W.phase==='done'||W.phase==='intro') return;
  const me=W.me; if(me.dead||!skillOpen(i)) return;
  const sk=skillAt(i); if(!sk) return;
  const rm=runeAt(i).m, M=W.d.M;
  if(W.cds[i]>0||typeof W.casting==='number') return;
  if((W.gcd||0)>0) return;                          // 전역 재사용 대기
  const cost=sk.cost*(rm.cost||1)*M.cost;
  if(me.mana<cost){ const R=W.d?W.d.resN:resOf(SPECS[P.spec].cls);
    logM('<span style="color:#c96b6b">'+R.n+' 부족</span>'); return; }
  const cast=(sk.cast||0)*(rm.cast||1);
  if(cast>0){ const h=1+(W.d.haste+(W.buffs.haste?W.buffs.hasteVal:0))/100;
    W.casting=i; W.castLeft=cast/h; W.castTotal=cast/h; setAnim(me,'cast'); }
  else fireSkill(i);
}
function fireSkill(i,free){
  const sk=skillAt(i); if(!sk) return;
  const rm=runeAt(i).m;
  const me=W.me,d=W.d,M=d.M;
  if(!free){ me.mana=Math.max(0,me.mana-sk.cost*(rm.cost||1)*M.cost);
    const h=1+(d.haste+(W.buffs.haste?W.buffs.hasteVal:0))/100;
    let cd=sk.cd*(rm.cd||1)*M.cdr*(['haste','dmgup','dotup'].includes(sk.tag)?M.ultCdr:1);
    if(sk.cd<30) cd/=h; W.cds[i]=cd; }
  W.gcd=Math.max(0.62,1.05/(1+W.d.haste/100));     // 가속이 높을수록 짧아진다
  const melee=CLASSES[SPECS[P.spec].cls].prim==='str';
  const tgt=nearestEnemy(me,melee?46:170);
  const CB=nextCombo(me,W.t);                      // 1·2·3타 순환
  setAnim(me,'atk');
  if(CB.shock&&W.t-(W._lastShake||-9)>0.7){ W._lastShake=W.t; W.shake=Math.max(W.shake||0,.13*CB.shock); }
  if(tgt) me.face=tgt.x>=me.x?1:-1;

  const dur=rm.dur||0;
  // 도약류: 방향으로 순간 이동
  if(sk.tag==='blink'||sk.tag==='blinkhit'){
    const tg=nearestEnemy(me,220);
    let dx=me.face,dy=0;
    if(sk.tag==='blinkhit'&&tg){ const L=Math.hypot(tg.x-me.x,tg.y-me.y)||1;
      dx=(tg.x-me.x)/L; dy=(tg.y-me.y)/L; }
    const dist=sk.blink||60;
    for(let q=Math.abs(dist);q>0;q-=6){
      const nx=me.x+dx*Math.sign(dist)*q, ny=me.y+dy*Math.sign(dist)*q*.7;
      if(inBounds(nx,ny,10)){ me.x=nx; me.y=ny; break; } }
    addFx('frostAura',{x:me.x,y:me.y-10,life:.5,r:1});
    for(let q=0;q<10;q++) part(me.x+rnd(-8,8),me.y-rnd(0,18),rnd(-20,20),rnd(-20,4),.4,SPECS[P.spec].color,1);
    if(sk.dr){ W.buffs.wall=sk.dur||2; W.buffs.wallVal=sk.dr; }
    if(sk.tag==='blink') return;
  }
  if(sk.tag==='selfheal'){ const amt=me.maxhp*(sk.selfPct||.3);
    me.hp=Math.min(me.maxhp,me.hp+amt); popup(me.x,me.y-20,'+'+fmt(amt),'#8fe8a0');
    for(let q=0;q<12;q++) part(me.x+rnd(-7,7),me.y-rnd(0,18),rnd(-5,5),rnd(-34,-14),rnd(.4,.9),'#ffe8a0',1);
    return; }
  switch(sk.tag){
   case 'haste': W.buffs.haste=dur||20; W.buffs.hasteVal=rm.val||40;
     if(rm.dr){W.buffs.wall=dur||20; W.buffs.wallVal=rm.dr;}
     if(rm.swap==='dmgup'){ delete W.buffs.haste; W.buffs.dmgup=dur||14; W.buffs.dmgVal=rm.val; }
     addFx(sk.fx,{x:me.x,y:me.y-10,life:.8,r:1}); logM('<b style="color:'+SPECS[P.spec].color+'">'+sk.n+'</b>'); return;
   case 'dmgup': W.buffs.dmgup=dur||18; W.buffs.dmgVal=rm.val||32;
     if(rm.aoeUp) W.buffs.aoeUp=rm.aoeUp; if(rm.dr){W.buffs.wall=dur;W.buffs.wallVal=rm.dr;}
     addFx(sk.fx,{x:me.x,y:me.y-10,life:.8,r:1}); logM('<b style="color:'+SPECS[P.spec].color+'">'+sk.n+'</b>'); return;
   case 'dotup': W.buffs.dotup=dur||20; W.buffs.dotVal=1+(rm.val||100)/100;
     addFx(sk.fx,{x:me.x,y:me.y-10,life:.8,r:1}); logM('<b style="color:'+SPECS[P.spec].color+'">'+sk.n+'</b>'); return;
   case 'taunt': {
     if(W.boss&&W.boss.active){ W.boss.target=me;
       const tp=topThreat(); me.threat=((tp&&tp.threat)||0)*1.6+500; }
     let n2=0;                                    // 주변 잡몹을 전부 끌어온다
     (W.mobs||[]).forEach(m=>{ if(m.hp<=0) return;
       if(Math.hypot(m.x-me.x,m.y-me.y)>150) return;
       m.tauntBy=me; m.taunt=7; n2++;
       for(let q=0;q<5;q++) part(m.x+rnd(-6,6),m.y-10,rnd(-16,16),rnd(-26,-6),rnd(.3,.6),'#ffcf6b',1); });
     me.threat=(me.threat||0)+400;
     if(rm.dr){W.buffs.wall=6;W.buffs.wallVal=rm.dr;}
     W.shake=Math.max(W.shake||0,.14);
     addFx('bossRoar',{x:me.x,y:me.y,r:44,life:.6});
     for(let a2=0;a2<6.28;a2+=.35) part(me.x+Math.cos(a2)*10,me.y-8+Math.sin(a2)*6,
       Math.cos(a2)*54,Math.sin(a2)*40,.5,'#ffcf6b',2);
     if(n2) logM('<b style="color:#ffcf6b">도발</b> — '+n2+'마리를 끌어왔습니다.');
     return; }
   case 'wall': W.buffs.wall=dur||10; W.buffs.wallVal=1-(rm.val||55)/100;
     addFx('shieldBub',{x:me.x,y:me.y,life:dur||10}); return;
   case 'lastst':
     if(rm.selfHp){ me.maxhp*=rm.selfHp; me.hp=me.maxhp; }
     else allUnits().forEach(p=>{ if(!p.dead) p.hp=p.maxhp; });
     allUnits().forEach(p=>{ for(let k=0;k<8;k++) part(p.x+rnd(-6,6),p.y+rnd(-16,2),rnd(-4,4),rnd(-30,-12),rnd(.4,.8),'#ffe8a0',1); });
     logM('<b style="color:#ffe8a0">'+sk.n+'</b> — 파티가 되살아납니다.'); return;
   case 'heal': case 'shield': {
     const n=rm.targets||1;
     for(let k=0;k<n;k++){ const tg=lowestAlly(); if(!tg) break;
       const ov=1-Math.min(0.62,(W.ovl||0)/100*0.62);
       const amt=sk.coef*(rm.heal||1)*d.power*M.healRecv*ov*(Math.random()*100<d.crit?1.5:1);
       W.ovl=Math.min(100,(W.ovl||0)+26);
       tg.hp=Math.min(tg.maxhp,tg.hp+amt); me.heal+=amt;
       popup(tg.x,tg.y-20,'+'+fmt(amt),'#8fe8a0');
       for(let q=0;q<8;q++) part(tg.x+rnd(-6,6),tg.y+rnd(-16,2),rnd(-5,5),rnd(-34,-14),rnd(.4,.8),'#ffe8a0',1); }
     return; }
   case 'healall': {
     const ov2=1-Math.min(0.62,(W.ovl||0)/100*0.62);
     const amt=sk.coef*(rm.heal||1)*d.power*M.healRecv*ov2;
     W.ovl=Math.min(100,(W.ovl||0)+34);
     allUnits().forEach(p=>{ if(!p.dead){ p.hp=Math.min(p.maxhp,p.hp+amt); me.heal+=amt;
       for(let q=0;q<5;q++) part(p.x+rnd(-7,7),p.y+rnd(-16,2),rnd(-4,4),rnd(-30,-12),rnd(.4,.9),'#ffe8a0',1); }});
     addFx('healRain',{x:me.x,y:me.y,r:70,life:2}); return; }
  }
  if(!tgt&&sk.kind!=='aoe'){ logM('<span style="color:#c96b6b">대상 없음</span>'); W.cds[i]=Math.min(W.cds[i],.4); return; }

  const kind=sk.kind==='aoe'?'aoe':'single';
  if(sk.tag==='blinkhit'&&!tgt) return;
  let mult=M.all*(kind==='aoe'?M.aoe*(W.buffs.aoeUp?1+W.buffs.aoeUp/100:1):M.single);
  if(i===0) mult*=M.sk0;
  mult*= sk.cast>0?M.cast:M.instant;
  if(W.buffs.dmgup) mult*=1+W.buffs.dmgVal/100;
  if(W.buffs.stagger) mult*=.75;
  if(SPECS[P.spec].role==='딜러') mult*=1+(W.mom||0)*0.025;
  mult*= W.combatT<20?M.opener:M.late;
  if(M.lowHp>1&&me.hp/me.maxhp<=.4) mult*=M.lowHp;
  const hpr=tgt?tgt.hp/tgt.maxhp:1;
  mult*= hpr<=.35?M.exec:M.execHi;
  if(rm.dmg) mult*=rm.dmg;
  if(W.auto) mult*=autoDmg();
  if(sk.tag==='exec_slow'&&tgt&&tgt.slow>0) mult*=2.5;
  if(sk.tag==='exec_hp'&&hpr<(rm.execHp||.25)) mult*=(rm.execMul||3);
  if(sk.tag==='stack'||sk.tag==='stack2'){
    W.pStack=Math.min(rm.maxStack||5,W.pStack+(sk.tag==='stack2'?(rm.stacks||2):1));
    if(rm.stackDmg) mult*=Math.pow(rm.stackDmg,W.pStack-1); }
  if(sk.tag==='slow'&&tgt) tgt.slow=6*(rm.slow||1);

  const base=sk.coef*d.power*mult;
  if(sk.kind==='aoe'){
    const cx=tgt?tgt.x:me.x, cy=tgt?tgt.y:me.y, r=44*(rm.radius||1);
    addFx(sk.fx,{x:cx,y:cy,r,life:rm.dur?2*rm.dur:1.8});
    const n=Math.round(4*(rm.hits||1));
    for(let k=0;k<n;k++) setTimeout(()=>{ if(!W||W.mode!=='arena') return;
      enemies().forEach(e=>{ if(Math.hypot(e.x-cx,e.y-cy)<r+12) hitEnemy(e,base*.9,sk.n,true); }); },k*260);
    return;
  }
  const hits=Math.max(1,Math.round(rm.hits||1));
  for(let k=0;k<hits;k++) setTimeout(()=>{
    if(!W||W.mode!=='arena'||!tgt||tgt.hp<=0) return;
    let dmg=base;
    const isCrit=rm.alwaysCrit||sk.tag==='crit'||Math.random()*100<(d.crit+(rm.critAdd||0));
    if(isCrit){ dmg*=d.critMult; if(M.critMana) me.mana=Math.min(me.maxmana,me.mana+M.critMana); }
    const fx=FXD[sk.fx];
    if(fx&&(fx.k==='proj'||fx.k==='arrow'))
      addFx(sk.fx,{x0:me.x,y0:me.y-12,tx:tgt.x+rnd(-6,6),ty:tgt.y-8,cx:me.x,cy:me.y-12,life:2,
        onHit:()=>{ hitEnemy(tgt,dmg,sk.n,false,isCrit); afterHit(sk,rm,dmg,i,tgt); }});
    else if(fx&&fx.k==='beam'){ addFx(sk.fx,{x0:me.x,y0:me.y-12,tx:tgt.x,ty:tgt.y-8,life:.3});
      hitEnemy(tgt,dmg,sk.n,false,isCrit); afterHit(sk,rm,dmg,i,tgt); }
    else { addFx(sk.fx,{x:tgt.x,y:tgt.y-8,r:18,rot:rnd(-.5,.5),life:.3});
      burstParts(tgt.x,tgt.y-8,'shard',FXD[sk.fx].c,FXD[sk.fx].c2);
      hitEnemy(tgt,dmg,sk.n,false,isCrit); afterHit(sk,rm,dmg,i,tgt); }
  },k*110);
}
function afterHit(sk,rm,dmg,i,tgt){
  if(!W||W.mode!=='arena'||!W.d) return;
  const d=W.d,M=d.M,me=W.me;
  if(sk.tag==='ignite'&&!rm.noDot)
    W.dots.push({tgt,tick:.5,left:9*(rm.dur||1)*M.dotDur,dmg:sk.coef*d.power*.11*(rm.dotMul||1)*M.dot,
      name:sk.n,c:SPECS[P.spec].color});
  if(rm.bleed) W.dots.push({tgt,tick:.5,left:8*M.dotDur,dmg:d.power*.09*M.dot,name:'출혈',c:'#ff5050'});
  if(rm.drain!==undefined||sk.tag==='drain'){ const f=rm.drain!==undefined?rm.drain:.4;
    const gain=dmg*f; me.hp=Math.min(me.maxhp,me.hp+gain);
    if(gain>0) popup(me.x,me.y-24,'+'+fmt(gain),'#8fe8a0'); }
  if(rm.mana) me.mana=Math.min(me.maxmana,me.mana+rm.mana);
  if(rm.manaHit) me.mana=Math.min(me.maxmana,me.mana+rm.manaHit);
  if(rm.cdRefund&&W.cds[i]>0) W.cds[i]*=(1-rm.cdRefund);
  if(rm.reset&&Math.random()<rm.reset) W.cds[0]=0;
  if(M.reset1&&i===1&&Math.random()<M.reset1) W.cds[1]=0;
  const echo=(rm.echo||0)+M.echo;
  if(echo&&Math.random()<echo) setTimeout(()=>{ if(W&&W.mode==='arena') fireSkill(i,true); },130);
}
/* 역할 고유 메커니즘
   탱커 — 위협 수치: 보스는 위협이 가장 높은 대상을 문다.
   힐러 — 과부하: 몰아서 치유하면 효율이 급감한다.
   딜러 — 기세: 계속 때리면 피해가 오르고 손을 놓으면 식는다. */
const ROLE_INFO={
 '탱커':'위협 수치를 쌓아 보스를 붙잡는다. 도발로 시선을 되찾아라.',
 '힐러':'과부하를 피해 치유를 나눠 써라. 몰아 쓰면 회복량이 급감한다.',
 '딜러':'기세를 끊지 말라. 계속 때릴수록 피해가 오른다.',
};
function addThreat(u,amt){ if(!u) return; u.threat=(u.threat||0)+amt; }
function topThreat(){
  let best=null,bv=-1;
  allUnits().forEach(u=>{ if(u.dead) return;
    const t=(u.threat||0)*(u.role==='탱커'?1.35:1);
    if(t>bv){ bv=t; best=u; } });
  return best;
}
/* 속죄 — 힐러가 준 피해의 일부가 그대로 파티 치유가 된다.
   와우 수양 사제가 이 구조로 「치유하면서 딜하는」 역할을 만들었다.
   덕분에 힐러도 혼자 사냥이 되고, 파티에서는 딜을 넣는 것이 곧 힐이 된다. */
const ATONE={holy:0.62,disc:0.85};
function atonement(amount){
  if(!W||!P||!W.d) return;
  const rate=ATONE[P.spec]; if(!rate) return;
  const heal=amount*rate*W.d.M.healRecv;
  if(heal<=0) return;
  let done=0;
  const hurtOnes=allUnits().filter(u=>!u.dead&&u.hp<u.maxhp);
  if(!hurtOnes.length) return;
  hurtOnes.forEach(u=>{ const q=Math.min(u.maxhp-u.hp,heal/Math.max(1,hurtOnes.length*0.55));
    u.hp+=q; done+=q; });
  if(done>0){ W.me.heal=(W.me.heal||0)+done;
    if(done>W.me.maxhp*0.03){
      const tg=hurtOnes[0];
      popup(tg.x,tg.y-24,'+'+fmt(Math.round(done)),'#8fe8a0');
      for(let q=0;q<5;q++) part(tg.x+rnd(-6,6),tg.y-14,rnd(-5,5),rnd(-28,-10),rnd(.3,.7),'#ffe8a0',1); } }
}
function hitEnemy(e,amount,src,silent,crit,by){
  if(!e||e.hp<=0) return;
  if(W&&W.client){                                 // 손님 — 피해는 방장이 반영한다
    Coop_send({t:'dm',v:Math.round(amount),c:crit?1:0});
    if(!silent){ popup(e.x+rnd(-10,10),e.y-16,fmt(amount)+(crit?'!':''),crit?'#ffd45c':'#fff',crit);
      for(let k=0;k<4;k++) part(e.x+rnd(-7,7),e.y-14,rnd(-40,40),rnd(-50,-6),rnd(.2,.4),'#fff2c8',1); }
    return; }
  if(e.absorb>0){ const a=Math.min(e.absorb,amount); e.absorb-=a; amount-=a;
    popup(e.x+rnd(-8,8),e.y-18,'흡수 '+fmt(a),'#c9a0ff'); if(e.absorb<=0){ e.absorb=0;
      logM('<b style="color:#ffcf6b">공허 방벽을 부쉈습니다!</b>'); } }
  if(W&&W.prologue&&e.isBoss){          // 회상 — 아무리 베어도 쓰러지지 않는다
    const floor=e.maxhp*0.08;
    if(e.hp-amount<=floor){
      amount=Math.max(0,e.hp-floor);
      if(!W.proHeal){ W.proHeal=1;
        logM('<b style="color:#ff8a6b">베어도 상처가 곧바로 아문다.</b> 이 싸움은 이길 수 없다.');
        toast('이길 수 없는 싸움입니다'); } } }
  if(amount<=0) return;
  /* 예전엔 아군이 넣은 피해도 전부 내 몫으로 잡혀서
     미터기에 동료 DPS가 0으로 찍혔다. 이제 실제 시전자에게 붙인다. */
  const who=by||W.me;
  e.hp-=amount; who.dmg=(who.dmg||0)+amount; W.dmgDone+=amount;
  if(!by&&W.d&&W.d.res.onHit&&!silent)             // 때리면서 자원을 쌓는다
    W.me.mana=Math.min(W.me.maxmana,W.me.mana+W.d.res.onHit);
  atonement(amount);                              // 힐러 — 딜이 곧 힐
  if(W.t-(e._fl||-9)>0.45){ e._fl=W.t; e.flash=.16; }   // 섬광이 겹쳐 굳지 않게
  if(!silent){                                     // 타격감 — 흔들림·불꽃은 매번, 멈칫은 큰 한 방에만
    const heavy=crit||amount>e.maxhp*0.02;
    if(heavy&&W.t-(W._lastShake||-9)>0.55){ W._lastShake=W.t; W.shake=Math.max(W.shake||0,0.16); }
    const n=heavy?9:4;
    for(let k=0;k<n;k++) part(e.x+rnd(-7,7),e.y-14+rnd(-6,6),
      rnd(-46,46),rnd(-56,-6),rnd(.18,.42),crit?'#ffd45c':'#fff2c8',1);
    // 0.5초에 한 번을 넘지 않는다 — 계속 걸리면 화면이 멈춘 것처럼 보인다
    if(heavy&&W.t-(W._lastStop||-9)>0.5){ W._lastStop=W.t; W.hitStop=0.055; } }
  if(!by) addThreat(W.me,amount*(SPECS[P.spec].role==='탱커'?2.2:1));
  if(SPECS[P.spec].role==='딜러'){ W.mom=Math.min(10,(W.mom||0)+1); W.momT=3.2; }
  if(!silent) popup(e.x+rnd(-10,10),e.y-16,fmt(amount)+(crit?'!':''),crit?'#ffd45c':'#fff',crit);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  if(W&&W.prologue&&e.isBoss){ e.hp=Math.max(e.hp,e.maxhp*0.08); return; }   // 회상은 대본대로만 끝난다
  e.hp=0;
  burstParts(e.x,e.y-8,'void',e.color||'#8a3cd8','#d8a0ff');
  if(e.isBoss){
    if(W.raid&&W.raid.id==='r5') bump('fallen',1);
    W.phase='done'; W.win=true; W.doneAt=now(); const R=W;
    setTimeout(()=>{ try{ R.pvp?finishDuel(true,R):finishRun(true,R); }
      catch(e){ showErr('정산 처리 오류: '+e.message);
        $('#ov').classList.add('hide'); toast('거점으로 돌아갑니다'); try{ enterCamp(); }catch(_){} } },900);
    return; }
  W.killed++; W.xp+=e.elite?30:8; W.gold+=e.elite?14:3;
  bump('kill',1); if(e.elite) bump('elite',1);
}
function hurt(u,amt,src){
  if(!u||u.dead) return;
  // 회상 전투는 연출이다 — 대본이 끝나기 전에는 아무도 죽지 않는다
  if(W&&W.prologue&&(W.proStage||0)<3) return;
  if(u.isP&&W.d){ if(W.buffs.corrupt) amt*=1+.20*W.buffs.corrupt;
    if(W.buffs.wall) amt*=W.buffs.wallVal;
    if(W.buffs.partyDr) amt*=W.buffs.partyDr; amt*=W.d.M.dr;
    const s=clamp(amt/u.maxhp*8,0,3); if(s>.2) W.buffs.stagger=Math.max(W.buffs.stagger||0,s); }
  u.hp-=amt; u.flash=.14;
  if(u.isP&&W.d&&W.d.res.decay>0)                  // 맞으면 분노가 오른다
    u.mana=Math.min(u.maxmana,u.mana+Math.min(18,amt/u.maxhp*90));
  if(u.isP&&amt>u.maxhp*.05) popup(u.x,u.y-26,'-'+fmt(amt),'#ff6b6b');
  if(u.anim!=='atk'&&u.anim!=='cast') setAnim(u,'hit');
  if(u.hp<=0){ u.hp=0; u.dead=true; setAnim(u,'dead');
    if(u.isP) W.deaths++;
    logM('<span style="color:#c96b6b">'+u.name+' 사망 ('+src+')</span>');
    for(let i=0;i<12;i++) part(u.x+rnd(-5,5),u.y-10,rnd(-25,25),rnd(-40,-8),rnd(.4,.9),'#a03030',1); }
}

let lastT=0, running=false;
function loop(ts){ if(!running) return;
  const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(W){ step(dt); stepFx(dt); coopTick(dt); draw(); }
  requestAnimationFrame(loop); }
function step(dt){
  if(W.hitStop>0&&!W.prologue){ W.hitStop-=dt; dt*=0.55; }   // 히트스톱 — 큰 한 방에만 짧게
  W.t+=dt;
  logs.forEach(l=>l.t-=dt); if(logs.length&&logs[0].t<=0){ logs.shift(); renderLog(); }
  const me=W.me;
  allUnits().forEach(u=>{ u.at+=dt; if(u.flash>0) u.flash-=dt;
    if(u.push){ u.push.t-=dt;                      // 넉백 — 축을 따로 밀어 벽에 안 박히게
      const nx=u.x+u.push.x*dt, ny=u.y+u.push.y*dt;
      if(inBounds(nx,u.y,8)) u.x=nx;
      if(inBounds(u.x,ny,8)) u.y=ny;
      u.wph=(u.wph||0)+1;
      if(u.push.t<=0) u.push=null; }
    if((u.anim==='atk'&&u.at>comboOf(u).dur)||(u.anim==='hit'&&u.at>.22)) setAnim(u,'idle'); });
  const mv=moveVec();
  const mount=W.mode==='camp'?cosOf('mount'):null;
  const spd=(W.mode==='camp'?70:66)*(mount?mount.spd:1)*((W.buffs&&W.buffs.spd)?1.55:1)*(me.chain?0.35:1);
  if(!me.dead&&!me.frozen){
    if(mv.L>.12&&typeof W.casting!=='number'){
      const ox=me.x,oy=me.y;
      const nx=me.x+mv.dx*spd*dt, ny=me.y+mv.dy*spd*dt*0.86;
      /* 축을 따로 밀어 벽면을 타고 미끄러지게 한다.
         한 축이 막혀도 다른 축은 살아 있어 모서리에 박히지 않는다. */
      let mx=false,my=false;
      if(inBounds(nx,me.y,8)){ me.x=nx; mx=true; }
      if(inBounds(me.x,ny,8)){ me.y=ny; my=true; }
      if(!mx&&!my){                       // 대각으로 막혔으면 벽을 따라 옆으로 흘린다
        const sx2=me.x+(mv.dx>0?1:-1)*spd*dt*0.7;
        const sy2=me.y+(mv.dy>0?1:-1)*spd*dt*0.6;
        if(inBounds(sx2,me.y,8)) me.x=sx2;
        else if(inBounds(me.x,sy2,8)) me.y=sy2; }
      me.wph=(me.wph||0)+Math.hypot(me.x-ox,me.y-oy)*.30;
      const last=W.trail[W.trail.length-1];
      if(!last||Math.hypot(me.x-last.x,me.y-last.y)>9){
        W.trail.push({x:me.x,y:me.y}); if(W.trail.length>60) W.trail.shift(); }
      me.face=mv.dx>0?1:mv.dx<0?-1:me.face;
      if(me.anim!=='atk'&&me.anim!=='cast') setAnim(me,'walk');
    } else if(me.anim==='walk') setAnim(me,'idle');
  }
  if(me.frozen){ me.frozen-=dt; if(me.frozen<=0) me.frozen=0; }
  if(mv.L>.12&&typeof W.casting==='number'&&W.d&&!W.d.M.moveCast&&!W.auto){
    W.casting=null; setAnim(me,'idle'); logM('<span style="color:#c96b6b">시전 취소</span>'); }
  me.mount=mount;
  if(!me.dead&&!inBounds(me.x,me.y,4)){ me.x=clamp(me.x,W.x0+16,W.x1-16);
    me.y=clamp(me.y,(W.gate&&!W.gateOpen?W.gate+14:W.y0+14),W.y1-14); }
  /* 끼임 구제 — 예전엔 무대 밖으로 순간이동시켜 버려서
     싸우다 갑자기 화면이 튀었다. 지금은 「가장 가까운 빈자리」로 조금씩 밀어낸다. */
  if(!me.dead&&mv.L>.12){
    const moved=Math.hypot(me.x-(me._px||me.x),me.y-(me._py||me.y));
    me._jam=moved<0.25?(me._jam||0)+dt:0;
    if(me._jam>1.1){ me._jam=0; W.casting=null;
      let best=null,bd=1e9;
      for(let a2=0;a2<6.283;a2+=0.393)
        for(let r2=10;r2<=64;r2+=9){
          const tx=me.x+Math.cos(a2)*r2, ty=me.y+Math.sin(a2)*r2;
          if(!inBounds(tx,ty,9)) continue;
          if(r2<bd){ bd=r2; best={x:tx,y:ty}; } }
      if(best){ me.x=best.x; me.y=best.y; } }
  } else me._jam=0;
  me._px=me.x; me._py=me.y;
  // 2.5D 카메라: 좌우만 따라가고 세로는 무대 전체를 담는다
  CAM.x=0; CAM.y=0;
  if(W.mode==='camp'){ stepCamp(dt); return; }
  stepArena(dt);
}
function stepCamp(dt){

function stepClient(dt){

  W.dots=W.dots.filter(o=>o.left>0);

const PVP_NAMES=['검은칼날','서리송곳','재의사냥꾼','무쇠맹세','그림자엮은','불꽃증인','고요한칼',
  '균열보행자','백일몽','늑대의약속','밤을삼킨','마지막종'];
function makeDuelist(rating){
  /* 투기장은 "장비 격차"가 아니라 "빌드와 조작"으로 갈리게 한다.
     상대 체력·화력을 내 화력·체력에 맞춰 맞대결이 되도록 역산한다. */
  const d=derive(), myDps=Math.max(1,estDps(d));
  const keys=Object.keys(SPECS).filter(k=>SPECS[k].role!=='힐러');
  const spec=pick(keys), sp=SPECS[spec], race=pick(Object.keys(RACES)), rm=RACES[race].m;
  const ilvl=Math.max(40,Math.round(d.avgIlvl+rnd(-6,6)+(rating-1000)/60));
  // 내가 완벽하게 딜하면 32~44초, 그 사이에 상대도 나를 죽일 만큼만 때린다
  // 점수가 오를수록 상대가 강해진다 → 실력만큼만 올라가고 거기서 멈춘다
  const RF=1+(rating-1000)/1500;
  const hp=myDps*rnd(44,58)*RF*(rm.hp||1);
  const crit=clamp(BAL.CRIT_BASE+rnd(8,26)+(rm.critAdd||0),0,70);
  const critMult=Math.max(1.1,BAL.CRIT_MULT+(rm.critDmg||0));
  const critF=1+crit/100*(critMult-1);

/* ======================================================================
   협동 레이드 — 서버 없이 둘이 같은 보스를 잡는다.
   중계 서버가 없으므로 브라우저끼리 직접 연결(P2P)한다.
   방장이 만든 「방 코드」를 친구가 붙여넣고, 친구가 만든 「응답 코드」를
   방장이 다시 붙여넣으면 연결된다. 이후에는 코드 교환이 필요 없다.
   방장이 전투를 계산하고, 친구는 자기 조작과 피해만 보낸다.
   ====================================================================== */
const Coop=(()=>{
  let pc=null, ch=null, role=null, on=false;
  let peer={name:'',spec:'',race:''};
  const CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'},
                         {urls:'stun:stun1.l.google.com:19302'}]};
  const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const dec=t=>JSON.parse(decodeURIComponent(escape(atob(String(t).replace(/\s+/g,'')))));
  const ok=()=>typeof RTCPeerConnection!=='undefined';
  let handlers={};
  function wire(){
    ch.onopen=()=>{ on=true; toast('<b style="color:#8fe8a0">친구와 연결되었습니다</b>');
      send({t:'hi',n:P.name,s:P.spec,r:P.race}); if(handlers.open) handlers.open(); };
    ch.onclose=()=>{ on=false; toast('연결이 끊어졌습니다'); if(handlers.close) handlers.close(); };
    ch.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
      if(m.t==='hi'){ peer={name:m.n,spec:m.s,race:m.r}; if(handlers.open) handlers.open(); return; }
      if(handlers.msg) handlers.msg(m); };
  }
  function gather(){                      // ICE 후보를 다 모아야 코드가 완성된다
    return new Promise(res=>{
      if(pc.iceGatheringState==='complete') return res();
      const t0=Date.now();
      const chk=()=>{ if(pc.iceGatheringState==='complete'||Date.now()-t0>4000){ res(); }
        else setTimeout(chk,200); };
      chk(); });
  }
  return {
    ok, isOn:()=>on, role:()=>role, peer:()=>peer,
    handlers(h){ handlers=h||{}; },
    async host(){
      if(!ok()) throw new Error('이 브라우저는 P2P 연결을 지원하지 않습니다');
      role='host'; pc=new RTCPeerConnection(CFG);
      ch=pc.createDataChannel('astella',{ordered:true}); wire();
      const o=await pc.createOffer(); await pc.setLocalDescription(o); await gather();
      return enc({t:'offer',d:pc.localDescription});
    },
    async accept(code){                    // 방장이 친구의 응답 코드를 넣는다
      const m=dec(code); if(m.t!=='answer') throw new Error('응답 코드가 아닙니다');
      await pc.setRemoteDescription(m.d); return true;
    },
    async join(code){                      // 친구가 방 코드를 넣는다
      if(!ok()) throw new Error('이 브라우저는 P2P 연결을 지원하지 않습니다');
      const m=dec(code); if(m.t!=='offer') throw new Error('방 코드가 아닙니다');
      role='guest'; pc=new RTCPeerConnection(CFG);
      pc.ondatachannel=e=>{ ch=e.channel; wire(); };
      await pc.setRemoteDescription(m.d);
      const a=await pc.createAnswer(); await pc.setLocalDescription(a); await gather();
      return enc({t:'answer',d:pc.localDescription});
    },
    close(){ try{ if(ch) ch.close(); if(pc) pc.close(); }catch(e){}
      pc=null; ch=null; on=false; role=null; },
  };
  function send(m){ try{ if(ch&&ch.readyState==='open') ch.send(JSON.stringify(m)); }catch(e){} }
  Coop_send=send;
})();

function coopBind(){

    open(){ if(typeof winRaid==='function'&&!$('#ov').classList.contains('hide')) try{winRaid();}catch(e){} },
    close(){ if(W&&W.client){ toast('연결이 끊어졌습니다 — 거점으로'); enterCamp(); } },
    msg(m){
      if(m.t==='sn'){ coopApply(m); return; }
      if(m.t==='in'){                              // 방장이 손님의 조작을 받는다
        const g=(W&&W.party||[]).find(u=>u.isGuest);
        if(g){ g.x=m.x; g.y=m.y; g.anim=m.an; g.face=m.fc; g.dead=!!m.d;

        const g2=(W.party||[]).find(u=>u.isGuest);

function stepDuel(dt){
  const f=W.foe, me=W.me;
  if(!f||f.hp<=0) return;
  f.at+=dt; if(f.flash>0) f.flash-=dt;
  if(f.anim==='atk'&&f.at>.42) setAnim(f,'idle');
  if(me.dead){ W.phase='done'; W.win=false; const R=W; setTimeout(()=>finishDuel(false,R),800); return; }
  const melee=CLASSES[SPECS[f.spec].cls].prim==='str';
  const want=melee?26:96, dd=Math.hypot(f.x-me.x,f.y-me.y)||1;
  let dx=0,dy=0;
  if(Math.abs(dd-want)>14){ const s=(dd>want?1:-1); dx=(me.x-f.x)/dd*s; dy=(me.y-f.y)/dd*s; }
  W.zones.forEach(z=>{ if(z.warn<=0&&Math.hypot(f.x-z.x,f.y-z.y)<z.r+10){
    const L=Math.hypot(f.x-z.x,f.y-z.y)||1; dx+=(f.x-z.x)/L*1.6; dy+=(f.y-z.y)/L*1.6; } });
  const L2=Math.hypot(dx,dy);
  if(L2>.1){ const s=58*dt, ox=f.x,oy=f.y;
    if(inBounds(f.x+dx/L2*s,f.y,10)) f.x+=dx/L2*s;
    if(inBounds(f.x,f.y+dy/L2*s*.86,10)) f.y+=dy/L2*s*.86;
    f.wph=(f.wph||0)+Math.hypot(f.x-ox,f.y-oy)*.30;
    if(f.anim!=='atk') setAnim(f,'walk'); }
  else if(f.anim==='walk') setAnim(f,'idle');
  f.face=me.x>f.x?1:-1;
  const bmul=f.burst>0?1.35:1;
  if(f.burst>0) f.burst-=dt;
  f.t1-=dt;
  if(f.t1<=0){ f.t1=1.5; setAnim(f,'atk');
    const dmg=f.power*1.25*bmul*(Math.random()*100<f.crit?f.critMult:1);
    addFx(pick(['iceBolt','fireBolt','voidBolt','arrow']),
      {x0:f.x,y0:f.y-12,tx:me.x,ty:me.y-8,cx:f.x,cy:f.y-12,life:2,onHit:()=>hurt(me,dmg,f.name)}); }
  f.t2-=dt;
  if(f.t2<=0){ f.t2=7.5;
    W.zones.push({x:clamp(me.x+rnd(-14,14),W.x0+24,W.x1-24),y:clamp(me.y+rnd(-12,12),W.y0+22,W.y1-16),
      r:26,warn:1.3,life:5,dmg:f.power*.85}); }
  f.t3-=dt;
  if(f.t3<=0){ f.t3=19; f.burst=6; addFx('furyAura',{x:f.x,y:f.y-10,life:.8,r:1});
    logM('<b style="color:#ff8f6b">'+f.name+'</b>이(가) 힘을 끌어올립니다.'); }
  $('#bName').textContent=f.name+' · '+RACES[f.race].n+' '+SPECS[f.spec].n;
  $('#bHp').style.width=(clamp(f.hp/f.maxhp,0,1)*100)+'%';
  $('#bCast').textContent='아이템 레벨 '+f.ilvl+' · 내 점수 '+(P.rating||1000);

/* 자동 조작 — 편의 기능. 단계가 올라갈수록 불리해진다. */
function autoPlay(dt){
  const me=W.me; if(me.dead) return;
  W.usedAuto=true;
  let danger=null;
  W.zones.forEach(z=>{ if(z.warn<=0&&Math.hypot(me.x-z.x,me.y-z.y)<z.r+10) danger=z; });
  W.tele.forEach(t=>{ if(t.type==='circle'&&t.warn<autoReact()&&Math.hypot(me.x-t.x,me.y-t.y)<t.r+8) danger=t; });
  const tgt=nearestEnemy(me,500);
  let dx=0,dy=0;
  if(danger){ dx=me.x-danger.x; dy=me.y-danger.y; }
  else if(tgt){ const melee=CLASSES[SPECS[P.spec].cls].prim==='str';
    const want=melee?26:110, dd=Math.hypot(tgt.x-me.x,tgt.y-me.y)||1;
    if(dd>want){ dx=tgt.x-me.x; dy=tgt.y-me.y; } }
  const L=Math.hypot(dx,dy)||1;
  if(L>6&&!me.frozen){ const s=62*dt, ox=me.x,oy=me.y;
    if(inBounds(me.x+dx/L*s,me.y,8)) me.x+=dx/L*s;
    if(inBounds(me.x,me.y+dy/L*s*.86,8)) me.y+=dy/L*s*.86;
    me.wph=(me.wph||0)+Math.hypot(me.x-ox,me.y-oy)*.30;
    me.face=dx>0?1:-1; if(me.anim!=='atk'&&me.anim!=='cast') setAnim(me,'walk'); }
  if(typeof W.casting!=='number'&&tgt) for(let i=5;i>=0;i--)
    if(skillOpen(i)&&W.cds[i]<=0){ useSkill(i); break; }
}

  if(W.orbs){ const left=W.orbs.filter(o=>!o.taken).length;

function txtScreen(str,x,y,c,size){

/* 발걸음 자국 — 지나온 자리에 꾸미기별로 다른 흔적이 남는다 */
function drawTrail(){
  const tr=cosOf('trail'); const me=W.me;
  if(!tr||!me||me.dead){ W._tr=W._tr||[]; }
  W._tr=W._tr||[];
  if(tr&&me&&!me.dead){
    const last=W._tr[W._tr.length-1];
    if(!last||Math.hypot(me.x-last.x,me.y-last.y)>9){
      W._tr.push({x:me.x,y:me.y,t0:W.t,s:(W._tr.length%2)?1:-1});
      if(W._tr.length>26) W._tr.shift(); }
  }
  if(!tr){ W._tr.length=0; return; }
  const LIFE=1.9, c=tr.v, L=sh(c,50), fx=tr.fx;
  W._tr=W._tr.filter(m=>W.t-m.t0<LIFE);
  W._tr.forEach(m=>{
    const age=(W.t-m.t0)/LIFE, a=1-age, p=proj(m.x,m.y), sc=p.sc;
    const bx=p.sx+m.s*2.2*sc, by=p.sy-tierH(m.y)*sc;
    g.globalAlpha=a*.85;
    if(fx==='frost'){ g.fillStyle=c; g.fillRect(bx-1.6*sc,by-1*sc,3.2*sc,2*sc);
      g.fillStyle=L; for(let k=0;k<3;k++) g.fillRect(bx-2.6*sc+k*2.2*sc,by-2.4*sc-age*3*sc,1*sc,1*sc); }
    else if(fx==='ember'||fx==='lava'){ g.fillStyle=fx==='lava'?'#ff3a0a':c;
      g.fillRect(bx-1.6*sc,by-1*sc,3.2*sc,2*sc);
      g.globalAlpha=a*a*.9; g.fillStyle='#ffd06a';
      g.fillRect(bx-.8*sc,by-2.5*sc-age*7*sc,1.6*sc,2*sc); }
    else if(fx==='petal'){ g.fillStyle=c;
      for(let k=0;k<3;k++){ const ang=W.t*1.4+k*2.1+m.t0;
        g.fillRect(bx+Math.cos(ang)*3*sc,by-age*6*sc+Math.sin(ang)*2*sc,1.8*sc,1.8*sc); } }
    else if(fx==='star'){ g.fillStyle=L;
      const tw=.4+.6*Math.abs(Math.sin(W.t*4+m.t0*7));
      g.globalAlpha=a*tw; g.fillRect(bx-.8*sc,by-1.4*sc,1.6*sc,1.6*sc);
      g.fillRect(bx-2.6*sc,by-.6*sc,5.2*sc,.8*sc); g.fillRect(bx-.4*sc,by-3*sc,.8*sc,5*sc); }
    else if(fx==='rift'){ g.fillStyle=c;
      g.fillRect(bx-2.4*sc,by-.6*sc,4.8*sc,1.2*sc);
      g.globalAlpha=a*.55; g.fillStyle=L;
      g.fillRect(bx-1*sc,by-3.4*sc+age*2*sc,2*sc,4*sc); }
    else if(fx==='gold'){ g.fillStyle=c;
      g.fillRect(bx-1.8*sc,by-1.2*sc,3.6*sc,2.4*sc);
      g.globalAlpha=a*.5; g.fillStyle='#fff6d0'; g.fillRect(bx-2.6*sc,by-1.8*sc,5.2*sc,.8*sc); }
    else { g.fillStyle=c; g.fillRect(bx-1.6*sc,by-1*sc,3.2*sc,2*sc); }
  });
  g.globalAlpha=1;
}

const FX2={q:2, a:null, b:null, dith:1, sat:1, dpat:null};   // q 2=높음 1=보통 0=끔
function fxCanvas(key,w,h){
  let c=FX2[key];

  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
